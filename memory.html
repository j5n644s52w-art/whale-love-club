<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Our Memory | Whale Love Club</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="/theme.css?v=5">
<script src="/theme.js?v=5"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #070707;
      --card: #111;
      --line: rgba(255,255,255,.08);
      --text: #f7f3ee;
      --muted: #96918b;
      --gold: #d8b184;
      --gold-soft: #f0d5b2;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -5%,
          rgba(216,177,132,.15),
          transparent 28%
        ),
        #070707;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

      padding-bottom:
        calc(
          45px +
          env(safe-area-inset-bottom)
        );

    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .page {

      width: min(100%, 760px);

      margin: 0 auto;

      padding:
        calc(
          20px +
          env(safe-area-inset-top)
        )
        18px
        40px;

    }

    /* HEADER */

    .topbar {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 24px;

    }

    .back {

      border: 0;

      background: transparent;

      color: var(--muted);

      padding: 8px 0;

      font-size: 14px;

    }

    .brand {
      text-align: right;
    }

    .brand-small {

      color: var(--gold);

      font-size: 10px;

      letter-spacing: 3px;

    }

    .brand-name {

      margin-top: 4px;

      font-family: Georgia, serif;

      font-size: 15px;

    }

    /* COVER */

    .cover {

      position: relative;

      height: 420px;

      border-radius: 25px;

      overflow: hidden;

      border:
        1px solid var(--line);

      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(216,177,132,.18),
          transparent 45%
        ),
        #101010;

      display: flex;

      justify-content: center;

      align-items: center;

    }

    .cover img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }

    .cover-placeholder {

      width: 85px;

      height: 85px;

      border-radius: 50%;

      border:
        1px solid
        rgba(216,177,132,.25);

      display: flex;

      align-items: center;

      justify-content: center;

      font-family: Georgia, serif;

      font-size: 32px;

      color: var(--gold);

    }

    .cover-overlay {

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          to bottom,
          transparent 48%,
          rgba(0,0,0,.82) 100%
        );

      pointer-events: none;

    }

    .cover-label {

      position: absolute;

      left: 20px;

      right: 20px;

      bottom: 20px;

    }

    .cover-date {

      font-size: 10px;

      color: var(--gold-soft);

      letter-spacing: 3px;

      margin-bottom: 7px;

    }

    .cover-title {

      font-family:
        Georgia,
        "Noto Serif TC",
        serif;

      font-size: 29px;

      line-height: 1.25;

    }

    /* INFO */

    .memory-info {

      padding: 27px 4px 4px;

    }

    .eyebrow {

      color: var(--gold);

      font-size: 9px;

      letter-spacing: 4px;

      margin-bottom: 11px;

    }

    .location {

      color: var(--muted);

      font-size: 12px;

      line-height: 1.7;

    }

    .location span {
      color: var(--gold);
    }

    .story {

      margin-top: 25px;

      padding-top: 23px;

      border-top:
        1px solid var(--line);

      font-family:
        Georgia,
        "Noto Serif TC",
        serif;

      font-size: 16px;

      line-height: 2;

      white-space: pre-wrap;

      color: #e4dfd9;

    }

    /* PHOTO TITLE */

    .photo-head {

      margin-top: 39px;

      margin-bottom: 17px;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }

    .photo-title {

      font-family: Georgia, serif;

      font-size: 14px;

      letter-spacing: 2px;

    }

    .photo-count {

      color: var(--muted);

      font-size: 10px;

      letter-spacing: 1px;

    }

    /* PHOTO GRID */

    .photos {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 9px;

    }

    .photo {

      position: relative;

      border-radius: 15px;

      overflow: hidden;

      background: #111;

      border:
        1px solid var(--line);

      min-height: 190px;

    }

    .photo:nth-child(3n+1) {

      grid-column:
        1 / -1;

      min-height: 310px;

    }

    .photo img {

      width: 100%;

      height: 100%;

      min-height: inherit;

      object-fit: cover;

      display: block;

    }

    .photo-caption {

      position: absolute;

      bottom: 0;

      left: 0;

      right: 0;

      padding:
        35px 13px 12px;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,.78)
        );

      font-size: 11px;

      line-height: 1.5;

      color: #eee;

    }

    /* ENDING */

    .ending {

      margin-top: 42px;

      text-align: center;

      color: var(--muted);

      padding: 29px 10px;

      border-top:
        1px solid var(--line);

    }

    .ending-heart {

      color: var(--gold);

      font-family: Georgia, serif;

      font-size: 23px;

      margin-bottom: 8px;

    }

    .ending-text {

      font-family: Georgia, serif;

      font-size: 12px;

      letter-spacing: 2px;

    }

    /* STATUS */

    .loading,
    .empty {

      margin-top: 50px;

      border:
        1px dashed var(--line);

      border-radius: 18px;

      padding: 50px 22px;

      color: var(--muted);

      text-align: center;

      font-size: 13px;

      line-height: 1.9;

    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 430px) {

      .cover {
        height: 360px;
      }

      .cover-title {
        font-size: 26px;
      }

      .photo {
        min-height: 165px;
      }

      .photo:nth-child(3n+1) {
        min-height: 260px;
      }

    }

  </style>

<script>
  const LIFF_ID =
    '2011857714-fZwEK6lN';


  let idToken = '';


  /* =========================================
     INIT
     ========================================= */

  async function init() {

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const memoryId =
        params.get('id');


      if (!memoryId) {

        throw new Error(
          '找不到這段回憶'
        );

      }


      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login({
          redirectUri:
            window.location.href
        });

        return;

      }


      idToken =
        liff.getIDToken();


      if (!idToken) {

        throw new Error(
          '無法取得 LINE 登入資訊'
        );

      }


      await loadMemory(
        memoryId
      );


    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        '無法載入這段回憶'
      );

    }

  }


  /* =========================================
     LOAD MEMORY
     ========================================= */

  async function loadMemory(
    memoryId
  ) {

    const query =
      new URLSearchParams({
        idToken:
          idToken,
        memoryId:
          memoryId
      });


    const response =
      await fetch(
        '/api/memories?' +
        query.toString()
      );


    const data =
      await response.json();


    if (!data.success) {

      const message =
        String(
          data.message || ''
        );


      if (
        message
          .toLowerCase()
          .includes('expired')
      ) {

        refreshLogin();
        return;

      }


      if (
        message ===
        'Memory is locked'
      ) {

        throw new Error(
          '這段回憶還沒有解鎖 ♡'
        );

      }


      throw new Error(
        message ||
        '讀取回憶失敗'
      );

    }


    renderMemoryShell(
      data.memory
    );


    await hydrateMemoryImages(
      data.memory
    );

  }


  /* =========================================
     先顯示文字內容
     ========================================= */

  function renderMemoryShell(
    memory
  ) {

    if (!memory) {

      showError(
        '找不到這段回憶'
      );

      return;

    }


    document
      .getElementById('loading')
      .classList
      .add('hidden');


    document
      .getElementById('content')
      .classList
      .remove('hidden');


    document
      .getElementById('coverTitle')
      .textContent =
      memory.title ||
      'Our Memory';


    document
      .getElementById('coverDate')
      .textContent =
      prettyDate(
        memory.eventDate
      );


    const location =
      document.getElementById(
        'location'
      );


    if (memory.location) {

      location.innerHTML =
        `<span>♡</span> ${
          escapeHtml(
            memory.location
          )
        }`;

    } else {

      location.style.display =
        'none';

    }


    const story =
      document.getElementById(
        'story'
      );


    story.textContent =
      memory.description ||
      '這一天，也成為了我們故事的一部分。';


    renderPhotosShell(
      memory.photos || []
    );

  }


  /* =========================================
     建立照片格骨架
     ========================================= */

  function renderPhotosShell(
    photos
  ) {

    const container =
      document.getElementById(
        'photos'
      );


    document
      .getElementById('photoCount')
      .textContent =
      `${photos.length} ${
        photos.length === 1
          ? 'PHOTO'
          : 'PHOTOS'
      }`;


    if (!photos.length) {

      container.innerHTML = `
        <div
          class="empty"
          style="
            grid-column: 1 / -1;
            margin-top: 0;
          "
        >
          這段回憶目前還沒有照片 ♡
        </div>
      `;

      return;

    }


    container.innerHTML =
      photos
        .map(
          function(photo, index) {

            return `
              <div class="photo">

                <img
                  data-photo-index="${index}"
                  alt="memory photo"
                  loading="lazy"
                >

                ${
                  photo.caption

                    ? `
                        <div class="photo-caption">
                          ${escapeHtml(
                            photo.caption
                          )}
                        </div>
                      `

                    : ''
                }

              </div>
            `;

          }
        )
        .join('');

  }


  /* =========================================
     一次載入封面 + 相簿照片
     每批最多 6 張
     ========================================= */

  async function hydrateMemoryImages(
    memory
  ) {

    const photos =
      memory.photos || [];


    const fileIds = [];


    if (memory.coverImageUrl) {
      fileIds.push(
        memory.coverImageUrl
      );
    }


    for (
      let i = 0;
      i < photos.length;
      i++
    ) {

      if (photos[i].imageUrl) {
        fileIds.push(
          photos[i].imageUrl
        );
      }

    }


    if (!fileIds.length) {
      return;
    }


    let photoMap = {};


    try {

      photoMap =
        await loadPrivatePhotoMap(
          fileIds
        );

    } catch (error) {

      console.error(
        '照片載入失敗',
        error
      );

      return;

    }


    if (
      memory.coverImageUrl &&
      photoMap[
        memory.coverImageUrl
      ]
    ) {

      setCoverImage(
        photoMap[
          memory.coverImageUrl
        ]
      );

    }


    const imageElements =
      document
        .querySelectorAll(
          '[data-photo-index]'
        );


    imageElements.forEach(
      function(img) {

        const index =
          Number(
            img.dataset.photoIndex
          );


        const photo =
          photos[index];


        if (!photo) {
          return;
        }


        const src =
          photoMap[
            photo.imageUrl
          ];


        if (src) {

          img.src =
            src;

        } else {

          const wrapper =
            img.closest(
              '.photo'
            );


          if (wrapper) {

            wrapper.innerHTML = `
              <div
                style="
                  min-height: inherit;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: var(--muted);
                  font-size: 12px;
                  text-align: center;
                  padding: 20px;
                "
              >
                照片暫時無法載入
              </div>
            `;

          }

        }

      }
    );

  }


  function setCoverImage(
    imageSrc
  ) {

    const cover =
      document.getElementById(
        'cover'
      );


    const placeholder =
      cover.querySelector(
        '.cover-placeholder'
      );


    if (placeholder) {
      placeholder.style.display =
        'none';
    }


    const oldImage =
      cover.querySelector(
        'img[data-memory-cover="1"]'
      );


    if (oldImage) {
      oldImage.remove();
    }


    const img =
      document.createElement(
        'img'
      );


    img.dataset.memoryCover =
      '1';

    img.src =
      imageSrc;

    img.alt =
      'memory cover';

    img.style.position =
      'absolute';

    img.style.inset =
      '0';

    img.style.width =
      '100%';

    img.style.height =
      '100%';

    img.style.objectFit =
      'cover';


    img.onerror =
      function() {

        img.remove();

        if (placeholder) {
          placeholder.style.display =
            '';
        }

      };


    cover.insertBefore(
      img,
      cover.firstChild
    );

  }


  /* =========================================
     私人照片讀取 + Session Cache
     ========================================= */

  async function loadPrivatePhotoMap(
    fileIds
  ) {

    const uniqueIds =
      Array.from(
        new Set(
          fileIds
            .map(
              function(value) {
                return String(
                  value || ''
                ).trim();
              }
            )
            .filter(Boolean)
        )
      );


    const result = {};

    const missing = [];


    for (
      let i = 0;
      i < uniqueIds.length;
      i++
    ) {

      const fileId =
        uniqueIds[i];


      const cached =
        readPhotoCache(
          fileId
        );


      if (cached) {

        result[fileId] =
          cached;

      } else {

        missing.push(
          fileId
        );

      }

    }


    for (
      let start = 0;
      start < missing.length;
      start += 6
    ) {

      const chunk =
        missing.slice(
          start,
          start + 6
        );


      const response =
        await fetch(
          '/api/photo',
          {
            method: 'POST',
            headers: {
              'Content-Type':
                'application/json'
            },
            body:
              JSON.stringify({
                idToken:
                  idToken,
                fileIds:
                  chunk
              })
          }
        );


      const data =
        await response.json();


      if (!data.success) {

        const message =
          String(
            data.message || ''
          );


        if (
          message
            .toLowerCase()
            .includes('expired')
        ) {

          refreshLogin();

          throw new Error(
            'LINE 登入已過期'
          );

        }


        throw new Error(
          message ||
          '照片讀取失敗'
        );

      }


      const loadedPhotos =
        Array.isArray(data.photos)
          ? data.photos
          : [];


      for (
        let i = 0;
        i < loadedPhotos.length;
        i++
      ) {

        const photo =
          loadedPhotos[i];


        if (
          !photo ||
          !photo.success ||
          !photo.fileId ||
          !photo.mimeType ||
          !photo.base64Data
        ) {
          continue;
        }


        const src =
          'data:' +
          photo.mimeType +
          ';base64,' +
          photo.base64Data;


        result[
          photo.fileId
        ] = src;


        writePhotoCache(
          photo.fileId,
          src
        );

      }

    }


    return result;

  }


  function readPhotoCache(
    fileId
  ) {

    try {

      return sessionStorage.getItem(
        'wlc-photo-v2:' +
        fileId
      ) || '';

    } catch (error) {

      return '';

    }

  }


  function writePhotoCache(
    fileId,
    src
  ) {

    try {

      sessionStorage.setItem(
        'wlc-photo-v2:' +
        fileId,
        src
      );

    } catch (error) {

      /*
       * WebView 儲存空間不足時，
       * 不影響照片當次顯示。
       */

    }

  }


  /* =========================================
     DATE
     ========================================= */

  function prettyDate(value) {

    if (!value) {
      return '';
    }


    const parts =
      String(value)
        .replaceAll('-', '/')
        .split('/');


    if (
      parts.length < 3
    ) {
      return value;
    }


    return (
      parts[0] +
      ' · ' +
      String(parts[1])
        .padStart(2, '0') +
      ' · ' +
      String(parts[2])
        .padStart(2, '0')
    );

  }


  /* =========================================
     ERROR
     ========================================= */

  function showError(message) {

    document
      .getElementById('loading')
      .classList
      .add('hidden');


    const box =
      document.getElementById(
        'errorBox'
      );


    box.classList.remove(
      'hidden'
    );


    box.innerHTML = `
      ♡<br><br>
      ${escapeHtml(
        message
      )}
    `;

  }


  /* =========================================
     BACK
     ========================================= */

  function goBack() {

    window.location.href =
      '/memories.html';

  }


  /* =========================================
     LOGIN
     ========================================= */

  function refreshLogin() {

    try {
      liff.logout();
    } catch (error) {}


    liff.login({
      redirectUri:
        window.location.href
    });

  }


  /* =========================================
     SAFE HTML
     ========================================= */

  function escapeHtml(value) {

    return String(
      value ?? ''
    )
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

  }


  init();

</script>
