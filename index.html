<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Whale Love Club</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0d;
      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .app {
      max-width: 430px;
      margin: auto;

      min-height: 100vh;

      padding:
        28px
        20px
        50px;
    }


    /* -------------------------
       Header
    ------------------------- */

    .brand {
      font-size: 12px;
      letter-spacing: 3px;
      color: #888;

      margin-bottom: 8px;
    }

    h1 {
      margin: 0;

      font-size: 26px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 5px;

      font-size: 12px;
      color: #777;

      letter-spacing: 2px;
    }


    /* -------------------------
       Member Card
    ------------------------- */

    .member-card {

      margin-top: 30px;

      padding: 25px;

      height: 205px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #222,
          #090909
        );

      border: 1px solid #333;

      box-shadow:
        0
        20px
        50px
        rgba(0,0,0,.45);

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {

      display: flex;
      justify-content: space-between;

      font-size: 12px;

      color: #aaa;

      letter-spacing: 2px;
    }

    .member-name {

      font-size: 23px;

      letter-spacing: 2px;
    }

    .member-number {

      color: #888;

      font-size: 12px;

      letter-spacing: 2px;

      margin-top: 5px;
    }

    .level {

      font-size: 11px;

      letter-spacing: 2px;

      color: #aaa;
    }


    /* -------------------------
       Love Points
    ------------------------- */

    .points {

      margin:
        32px
        0
        22px;

      text-align: center;
    }

    .points-label {

      color: #777;

      font-size: 11px;

      letter-spacing: 3px;
    }

    .points-number {

      font-size: 45px;

      margin-top: 4px;

      font-weight: 300;
    }


    /* -------------------------
       Function Menu
    ------------------------- */

    .grid {

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 12px;
    }

    .menu {

      background: #151517;

      border:
        1px
        solid
        #242426;

      border-radius: 17px;

      padding:
        20px
        17px;

      min-height: 110px;
    }

    .icon {

      font-size: 24px;

      margin-bottom: 14px;
    }

    .menu-title {

      font-size: 14px;
    }

    .menu-value {

      margin-top: 5px;

      color: #777;

      font-size: 12px;
    }


    /* -------------------------
       LINE Status
    ------------------------- */

    .line-status {

      margin-top: 30px;

      text-align: center;

      font-size: 11px;

      color: #666;

      letter-spacing: 1.5px;

      line-height: 1.8;
    }


    /* -------------------------
       Footer
    ------------------------- */

    .footer {

      text-align: center;

      color: #444;

      margin-top: 25px;

      font-size: 10px;

      letter-spacing: 2px;
    }

  </style>

</head>


<body>

<div class="app">


  <!-- Header -->

  <div class="brand">
    PRIVATE MEMBERS CLUB
  </div>

  <h1>
    ♡ Whale Love Club
  </h1>

  <div class="subtitle">
    MEMBERS ONLY
  </div>



  <!-- Member Card -->

  <div class="member-card">

    <div class="card-top">

      <span>
        ♡ WLC
      </span>

      <span>
        MEMBER
      </span>

    </div>


    <div>

      <div
        class="member-name"
        id="member-name">

      </div>


      <div
        class="member-number"

    </div>

  </div>



  <!-- Love Points -->

  <div class="points">

      LOVE POINTS

    </div>

    <div
      class="points-number"
      id="love-points">

      520

    </div>

  </div>



  <!-- Menu -->

  <div class="grid">


    <div class="menu">

      <div class="icon">
        💆
      </div>

        Massage
      </div>

      <div
        class="menu-value"
        id="massage-points">

        3 POINTS

      </div>

    </div>



    <div class="menu">

      <div class="icon">
        🎟️
      </div>

      <div class="menu-title">
        Love Coupon
      </div>

      <div class="menu-value">
        MY COUPONS
      </div>

    </div>



    <div class="menu">

      <div class="icon">
        🎁
      </div>

      <div class="menu-title">
        Gift Box
      </div>

      <div class="menu-value">
        MY GIFTS
      </div>

    </div>



    <div class="menu">

      <div class="icon">
        ♠️
      </div>

      <div class="menu-title">
        Collection
      </div>

      <div class="menu-value">
        NFC CARDS
      </div>

    </div>


  </div>



  <!-- LINE Connection Test -->

  <div
    id="line-status"
    class="line-status">

    CONNECTING TO LINE...

  </div>



  <!-- Footer -->

  <div class="footer">

    WHALE LOVE CLUB · PRIVATE MEMBERSHIP

  </div>


</div>

</script>


</body>

</html>
