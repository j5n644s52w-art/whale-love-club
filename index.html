<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Whale Love Club</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b0b0d;
      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;

      padding:
        calc(28px + env(safe-area-inset-top))
        20px
        calc(50px + env(safe-area-inset-bottom));
    }

    /* =========================
       Header
       ========================= */

    .brand {
      margin-bottom: 8px;
      color: #888;
      font-size: 12px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* =========================
       Member Card
       ========================= */

    .member-card {
      height: 205px;
      margin-top: 30px;
      padding: 25px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      border: 1px solid #333;
      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #222,
          #090909
        );

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.45);
    }

    .card-top {
      display: flex;
      justify-content: space-between;

      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .member-name {
      font-size: 23px;
      letter-spacing: 2px;
    }

    .member-number {
      margin-top: 5px;
      color: #888;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .level {
      color: #aaa;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* =========================
       Points
       ========================= */

    .points {
      margin: 32px 0 22px;
      text-align: center;
    }

    .points-label {
      color: #777;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .points-number {
      margin-top: 4px;
      font-size: 45px;
      font-weight: 300;
    }

    /* =========================
       Menu
       ========================= */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu {
      min-height: 110px;
      padding: 20px 17px;

      border: 1px solid #242426;
      border-radius: 17px;

      background: #151517;
    }

    .icon {
      margin-bottom: 14px;
      font-size: 24px;
    }

    .menu-title {
      font-size: 14px;
    }

    .menu-value {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }

    /* =========================
       Admin
       ========================= */

    .admin-panel {
      display: none;

      margin-top: 20px;
      padding: 16px 18px;

      border: 1px solid #29292c;
      border-radius: 15px;

      background: #111113;
    }

    .admin-label {
      color: #999;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .admin-text {
      margin-top: 5px;
      font-size: 13px;
    }

    /* =========================
       Status
       ========================= */

    .status {
      min-height: 45px;
      margin-top: 27px;

      color: #666;
      font-size: 11px;
      line-height: 1.8;
      letter-spacing: 1.3px;
      text-align: center;
    }

    .footer {
      margin-top: 20px;

      color: #444;
      font-size: 10px;
      letter-spacing: 2px;
      text-align: center;
    }
  </style>
</head>


<body>

  <main class="app">

    <!-- Header -->

    <div class="brand">
      PRIVATE MEMBERS CLUB
    </div>

    <h1>
      ♡ Whale Love Club
    </h1>

    <div class="subtitle">
      MEMBERS ONLY
    </div>


    <!-- Member Card -->

    <section class="member-card">

      <div class="card-top">

        <span>
          ♡ WLC
        </span>

        <span id="card-role">
          ...
        </span>

      </div>

      <div>

        <div
          class="member-name"
          id="member-name"
        >
          LOADING...
        </div>

        <div
          class="member-number"
          id="member-number"
        >
          ---
        </div>

      </div>

      <div
        class="level"
        id="member-level"
      >
        LOADING MEMBER DATA
      </div>

    </section>


    <!-- Love Points -->

    <section class="points">

      <div class="points-label">
        LOVE POINTS
      </div>

      <div
        class="points-number"
        id="love-points"
      >
        —
      </div>

    </section>


    <!-- Menu -->

    <section class="grid">

      <div class="menu">

        <div class="icon">
          💆
        </div>

        <div class="menu-title">
          Massage
        </div>

        <div
          class="menu-value"
          id="massage-points"
        >
          — POINTS
        </div>

      </div>


      <div class="menu">

        <div class="icon">
          🎟️
        </div>

        <div class="menu-title">
          Love Coupon
        </div>

        <div class="menu-value">
          MY COUPONS
        </div>

      </div>


      <div class="menu">

        <div class="icon">
          🎁
        </div>

        <div class="menu-title">
          Gift Box
        </div>

        <div class="menu-value">
          MY GIFTS
        </div>

      </div>


      <div class="menu">

        <div class="icon">
          ♠️
        </div>

        <div class="menu-title">
          Collection
        </div>

        <div class="menu-value">
          NFC CARDS
        </div>

      </div>

    </section>


    <!-- ADMIN 專用區 -->

    <section
      id="admin-panel"
      class="admin-panel"
    >

      <div class="admin-label">
        ADMIN MODE
      </div>

      <div class="admin-text">
        管理員帳號已驗證 ✓
      </div>

    </section>


    <!-- Status -->

    <div
      id="status"
      class="status"
    >
      CONNECTING TO LINE...
    </div>


    <div class="footer">
      WHALE LOVE CLUB · PRIVATE MEMBERSHIP
    </div>

  </main>


  <script>

    /* =========================================
       ★ 只需要修改這裡
       ========================================= */

    const LIFF_ID =
      '2011857712-lXq9lJFT';



    /* =========================================
       安全顯示文字
       ========================================= */

    function escapeHtml(value) {

      const div =
        document.createElement('div');

      div.textContent =
        String(value || '');

      return div.innerHTML;
    }



    /* =========================================
       狀態
       ========================================= */

    function setStatus(message) {

      document
        .getElementById('status')
        .innerHTML =
          message;
    }



    /* =========================================
       取得加入年份
       ========================================= */

    function getJoinYear(joinDate) {

      if (!joinDate) {
        return '';
      }

      const match =
        String(joinDate)
          .match(/\d{4}/);

      return match
        ? match[0]
        : '';
    }



    /* =========================================
       更新會員畫面
       ========================================= */

    function renderMember(member) {

      document
        .getElementById(
          'member-name'
        )
        .textContent =
          member.name ||
          'MEMBER';


      document
        .getElementById(
          'member-number'
        )
        .textContent =
          member.memberNo ||
          '---';


      document
        .getElementById(
          'love-points'
        )
        .textContent =
          member.lovePoints ?? 0;


      document
        .getElementById(
          'massage-points'
        )
        .textContent =
          (member.massagePoints ?? 0)
          + ' POINTS';


      const role =
        String(
          member.role || 'MEMBER'
        ).toUpperCase();


      document
        .getElementById(
          'card-role'
        )
        .textContent =
          role;


      const year =
        getJoinYear(
          member.joinDate
        );


      let levelText =
        member.level ||
        'MEMBER';


      if (year) {

        levelText +=
          ' · SINCE ' +
          year;

      }


      document
        .getElementById(
          'member-level'
        )
        .textContent =
          levelText;


      /* 管理員才看得到 */

      if (role === 'ADMIN') {

        document
          .getElementById(
            'admin-panel'
          )
          .style.display =
            'block';

      } else {

        document
          .getElementById(
            'admin-panel'
          )
          .style.display =
            'none';

      }

    }



    /* =========================================
       呼叫 Member API
       ========================================= */

    async function getMemberData(
      idToken
    ) {

      const response =
        await fetch(
          '/api/member',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify({
                idToken:
                  idToken
              })
          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch (error) {

        throw new Error(
          'Member API response error'
        );

      }


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.message ||
          'Unable to load member'
        );

      }


      return data.member;

    }



    /* =========================================
       LINE MINI App 初始化
       ========================================= */

    async function initApp() {

      try {

        /* 1. LIFF SDK */

        if (
          typeof liff ===
          'undefined'
        ) {

          throw new Error(
            'LIFF SDK is not available'
          );

        }


        /* 2. 初始化 */

        await liff.init({
          liffId:
            LIFF_ID
        });


        /* 3. LINE Login */

        if (
          !liff.isLoggedIn()
        ) {

          liff.login();

          return;

        }


        /* 4. ID Token */

        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            'ID token is not available'
          );

        }


        setStatus(
          'LOADING MEMBER PROFILE...'
        );


        /* 5. 後端驗證 + 查會員 */

        const member =
          await getMemberData(
            idToken
          );


        /* 6. 顯示真正資料 */

        renderMember(
          member
        );


        setStatus(
          'LINE CONNECTED ✓' +
          '<br>' +
          escapeHtml(
            member.memberNo
          ) +
          ' · ' +
          escapeHtml(
            member.role
          )
      );


      } catch (error) {

        console.error(
          'Whale Love Club Error:',
          error
        );


        setStatus(
          'MEMBER CONNECTION ERROR' +
          '<br>' +
          escapeHtml(
            error.message ||
            'Unknown error'
          )
        );

      }

    }



    /* =========================================
       啟動
       ========================================= */

    initApp();

  </script>

</body>

</html>
