<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>我們的記帳本 | Whale Love Club</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --card: #111111;
      --card-2: #171717;
      --line: rgba(255,255,255,.09);
      --text: #f7f3ee;
      --muted: #96918b;
      --gold: #d8b184;
      --gold-soft: #f1d7b6;
      --green: #9bd3ad;
      --red: #e7a3a3;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(216,177,132,.15),
          transparent 34%
        ),
        var(--bg);

      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

      padding-bottom:
        calc(40px + env(safe-area-inset-bottom));
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(100%, 720px);
      margin: 0 auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        18px
        40px;
    }

    /* HEADER */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .back {
      border: 0;
      background: none;
      color: var(--muted);
      padding: 8px 0;
      font-size: 14px;
    }

    .brand {
      text-align: right;
    }

    .brand-small {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
    }

    .brand-name {
      font-family: Georgia, serif;
      margin-top: 4px;
      font-size: 15px;
    }

    /* TITLE */

    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Noto Serif TC", serif;
      font-weight: 400;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 13px;
    }

    /* MONTH */

    .month-control {
      margin-top: 30px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      padding: 13px 0;
    }

    .month-control button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-size: 20px;
    }

    .month-label {
      text-align: center;
    }

    #monthTitle {
      font-family: Georgia, serif;
      font-size: 18px;
      letter-spacing: 2px;
    }

    #yearTitle {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 3px;
      margin-top: 4px;
    }

    /* SUMMARY */

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
    }

    .summary-card {
      background:
        linear-gradient(
          145deg,
          #161616,
          #0e0e0e
        );

      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 17px 12px;
    }

    .summary-title {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .summary-value {
      font-family: Georgia, serif;
      font-size: 18px;
      white-space: nowrap;
    }

    .income {
      color: var(--green);
    }

    .expense {
      color: var(--red);
    }

    .balance {
      color: var(--gold-soft);
    }

    /* ADD BUTTON */

    .add-button {
      width: 100%;
      margin-top: 18px;
      border: 1px solid rgba(216,177,132,.4);

      background:
        linear-gradient(
          135deg,
          rgba(216,177,132,.15),
          rgba(216,177,132,.04)
        );

      color: var(--gold-soft);
      border-radius: 14px;
      padding: 16px;

      font-size: 14px;
      letter-spacing: 1px;
    }

    /* LIST */

    .section-head {
      margin-top: 35px;
      margin-bottom: 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-family: Georgia, serif;
      letter-spacing: 2px;
      font-size: 15px;
    }

    .section-sub {
      color: var(--muted);
      font-size: 11px;
    }

    .entries {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entry {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);

      padding: 16px;
      border-radius: 15px;

      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    .entry-title {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .entry-meta {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7;
    }

    .entry-amount {
      font-family: Georgia, serif;
      font-size: 16px;
      white-space: nowrap;
    }

    /* DELETE */

.entry-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
}

.delete-button {
  border: 1px solid rgba(231,163,163,.28);

  background:
    rgba(231,163,163,.045);

  color: #b98989;

  border-radius: 10px;

  padding: 7px 11px;

  font-size: 11px;

  letter-spacing: .5px;

  cursor: pointer;

  transition: .18s;
}

.delete-button:active {
  transform: scale(.96);
}

.delete-button:disabled {
  opacity: .4;
  cursor: default;
}

    .entry-note {
      margin-top: 8px;
      font-size: 12px;
      color: #c6c1bb;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      line-height: 1.9;
      font-size: 13px;
    }

    /* LOADING */

    .loading {
      padding: 50px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* MODAL */

    .modal-mask {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.78);
      backdrop-filter: blur(8px);

      display: none;
      align-items: flex-end;
      justify-content: center;

      z-index: 100;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal {
      width: min(100%, 720px);
      max-height: 92vh;
      overflow-y: auto;

      background: #101010;
      border-top: 1px solid rgba(216,177,132,.35);

      border-radius: 26px 26px 0 0;

      padding:
        22px
        20px
        calc(24px + env(safe-area-inset-bottom));
    }

    .modal-handle {
      width: 42px;
      height: 4px;
      border-radius: 10px;
      background: #444;
      margin: 0 auto 22px;
    }

    .modal-title {
      font-family: Georgia, serif;
      font-size: 23px;
      margin-bottom: 22px;
    }

    .type-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;

      background: #080808;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .type-tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 11px;
      border-radius: 9px;
    }

    .type-tab.active {
      background: #1c1c1c;
      color: var(--gold-soft);
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .input {
      width: 100%;

      background: #090909;
      color: var(--text);

      border: 1px solid var(--line);
      border-radius: 12px;

      padding: 13px 14px;
      outline: none;
    }

    .input:focus {
      border-color: rgba(216,177,132,.65);
    }

    textarea.input {
      min-height: 85px;
      resize: vertical;
    }

    .two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .form-actions {
      display: grid;
      grid-template-columns: .7fr 1.3fr;
      gap: 10px;
      margin-top: 25px;
    }

    .cancel {
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
      border-radius: 12px;
      padding: 14px;
    }

    .save {
      border: 0;

      background:
        linear-gradient(
          135deg,
          #e3c099,
          #ad825b
        );

      color: #080808;
      font-weight: 700;

      border-radius: 12px;
      padding: 14px;
    }

    .save:disabled {
      opacity: .5;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom:
        calc(24px + env(safe-area-inset-bottom));

      transform:
        translate(-50%, 30px);

      opacity: 0;

      max-width: calc(100% - 40px);

      background: #f3e2cc;
      color: #111;

      padding: 12px 18px;
      border-radius: 999px;

      font-size: 12px;
      z-index: 999;

      transition: .25s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform:
        translate(-50%, 0);
    }

    @media (max-width: 430px) {

      h1 {
        font-size: 29px;
      }

      .summary {
        gap: 7px;
      }

      .summary-card {
        padding: 15px 9px;
      }

      .summary-value {
        font-size: 15px;
      }

      .two-cols {
        grid-template-columns: 1fr;
      }
    }
  </style>

<script>

  /*
   * 把這裡換成 index.html 使用的同一個 LIFF ID
   */
  const LIFF_ID =
    '2011857712-lXq9lJFT';


  let idToken = '';

  let selectedType =
    'EXPENSE';


  const now =
    new Date();


  let selectedYear =
    now.getFullYear();


  let selectedMonth =
    now.getMonth() + 1;



  const monthNames = [
    'JANUARY',
    'FEBRUARY',
    'MARCH',
    'APRIL',
    'MAY',
    'JUNE',
    'JULY',
    'AUGUST',
    'SEPTEMBER',
    'OCTOBER',
    'NOVEMBER',
    'DECEMBER'
  ];



  /* ==============================
     初始化
     ============================== */

  async function init() {

    try {

      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login({
          redirectUri:
            window.location.href
        });

        return;
      }


      idToken =
        liff.getIDToken();


      if (!idToken) {

        throw new Error(
          '無法取得 LINE 登入資訊'
        );

      }


      setToday();

      updateMonthTitle();

      await loadLedger();


    } catch (error) {

      console.error(error);

      document
        .getElementById('entries')
        .innerHTML = `

          <div class="empty">

            無法載入記帳本<br>

            ${escapeHtml(
              error.message ||
              '請稍後再試'
            )}

          </div>

        `;

    }

  }



  /* ==============================
     讀取資料
     ============================== */

  async function loadLedger() {

    document
      .getElementById('entries')
      .innerHTML = `

        <div class="loading">
          正在讀取記帳資料...
        </div>

      `;


    const params =
      new URLSearchParams({

        idToken:
          idToken,

        year:
          selectedYear,

        month:
          selectedMonth

      });


    const response =
      await fetch(
        '/api/ledger?' +
        params.toString()
      );


    const data =
      await response.json();


    if (!data.success) {

      if (
        String(
          data.message || ''
        )
          .toLowerCase()
          .includes('expired')
      ) {

        return refreshLogin();

      }


      throw new Error(
        data.message ||
        '讀取失敗'
      );

    }


    renderSummary(
      data.summary || {}
    );


    renderEntries(
      data.entries || []
    );

  }



  /* ==============================
     顯示摘要
     ============================== */

  function renderSummary(summary) {

    document
      .getElementById(
        'incomeValue'
      )
      .textContent =
      money(
        summary.income || 0
      );


    document
      .getElementById(
        'expenseValue'
      )
      .textContent =
      money(
        summary.expense || 0
      );


    document
      .getElementById(
        'balanceValue'
      )
      .textContent =
      money(
        summary.balance || 0
      );

  }



  /* ==============================
     顯示紀錄
     ============================== */

  function renderEntries(entries) {

  const container =
    document.getElementById(
      'entries'
    );


  document
    .getElementById(
      'recordCount'
    )
    .textContent =
    `${entries.length} 筆`;


  if (!entries.length) {

    container.innerHTML = `

      <div class="empty">

        這個月還沒有任何紀錄 ♡<br>

        點上方「新增一筆紀錄」開始記帳

      </div>

    `;

    return;

  }


  container.innerHTML =
    entries
      .map(entry => {

        const isIncome =
          entry.type === 'INCOME';


        const sign =
          isIncome
            ? '+'
            : '-';


        const amountClass =
          isIncome
            ? 'income'
            : 'expense';


        return `

          <article class="entry">

            <div>

              <div class="entry-title">

                ${escapeHtml(
                  entry.title
                )}

              </div>


              <div class="entry-meta">

                ${escapeHtml(
                  entry.date
                )}

                ・

                ${escapeHtml(
                  entry.category
                )}

                <br>

                付款：
                ${personName(
                  entry.paidBy
                )}

                ・

                對象：
                ${forWhomName(
                  entry.forWhom
                )}

              </div>


              ${
                entry.note

                ? `

                  <div class="entry-note">

                    ${escapeHtml(
                      entry.note
                    )}

                  </div>

                `

                : ''
              }

            </div>


            <div class="entry-side">

              <div
                class="
                  entry-amount
                  ${amountClass}
                "
              >

                ${sign}${money(
                  entry.amount
                )}

              </div>


              <button
                class="delete-button"
                type="button"
                onclick="
                  deleteEntry(
                    '${entry.entryId}',
                    this
                  )
                "
              >
                刪除
              </button>

            </div>

          </article>

        `;

      })
      .join('');

}

/* ==============================
   刪除紀錄
   ============================== */

async function deleteEntry(
  entryId,
  button
) {

  const entryElement =
    button.closest(
      '.entry'
    );


  const title =
    entryElement
      ?.querySelector(
        '.entry-title'
      )
      ?.textContent
      ?.trim() ||
    '這筆紀錄';


  const confirmed =
    window.confirm(
      `確定要刪除「${title}」嗎？\n\n刪除後無法復原。`
    );


  if (!confirmed) {
    return;
  }


  button.disabled =
    true;


  button.textContent =
    '刪除中...';


  try {

    const response =
      await fetch(
        '/api/ledger',
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              idToken:
                idToken,

              action:
                'delete',

              entryId:
                entryId

            })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      if (
        String(
          data.message || ''
        )
          .toLowerCase()
          .includes('expired')
      ) {

        return refreshLogin();

      }


      throw new Error(
        data.message ||
        '刪除失敗'
      );

    }


    showToast(
      '已刪除這筆紀錄'
    );


    await loadLedger();


  } catch (error) {

    console.error(
      error
    );


    showToast(
      error.message ||
      '刪除失敗'
    );


    button.disabled =
      false;


    button.textContent =
      '刪除';

  }

}

  /* ==============================
     月份切換
     ============================== */

  async function changeMonth(step) {

    selectedMonth += step;


    if (selectedMonth === 13) {

      selectedMonth = 1;

      selectedYear++;

    }


    if (selectedMonth === 0) {

      selectedMonth = 12;

      selectedYear--;

    }


    updateMonthTitle();


    try {

      await loadLedger();

    } catch (error) {

      showToast(
        error.message ||
        '月份載入失敗'
      );

    }

  }



  function updateMonthTitle() {

    document
      .getElementById(
        'monthTitle'
      )
      .textContent =
      monthNames[
        selectedMonth - 1
      ];


    document
      .getElementById(
        'yearTitle'
      )
      .textContent =
      selectedYear;

  }



  /* ==============================
     新增紀錄
     ============================== */

  function openModal() {

    setToday();

    document
      .getElementById(
        'modalMask'
      )
      .classList
      .add('show');

  }



  function closeModal() {

    document
      .getElementById(
        'modalMask'
      )
      .classList
      .remove('show');

  }



  function setType(type) {

    selectedType =
      type;


    document
      .getElementById(
        'expenseTab'
      )
      .classList
      .toggle(
        'active',
        type === 'EXPENSE'
      );


    document
      .getElementById(
        'incomeTab'
      )
      .classList
      .toggle(
        'active',
        type === 'INCOME'
      );

  }



  async function saveEntry() {

    const amount =
      Number(
        document
          .getElementById(
            'amount'
          )
          .value
      );


    const title =
      document
        .getElementById(
          'title'
        )
        .value
        .trim();


    if (
      !amount ||
      amount <= 0
    ) {

      showToast(
        '請輸入正確金額'
      );

      return;
    }


    if (!title) {

      showToast(
        '請輸入項目名稱'
      );

      return;
    }


    const entry = {

      type:
        selectedType,

      amount:
        amount,

      category:
        document
          .getElementById(
            'category'
          )
          .value,

      title:
        title,

      paidBy:
        document
          .getElementById(
            'paidBy'
          )
          .value,

      forWhom:
        document
          .getElementById(
            'forWhom'
          )
          .value,

      date:
        document
          .getElementById(
            'entryDate'
          )
          .value,

      note:
        document
          .getElementById(
            'note'
          )
          .value
          .trim()

    };


    const button =
      document.getElementById(
        'saveButton'
      );


    button.disabled = true;

    button.textContent =
      '儲存中...';


    try {

      const response =
        await fetch(
          '/api/ledger',
          {

            method:
              'POST',

            headers: {

              'Content-Type':
                'application/json'

            },

            body:
              JSON.stringify({

                idToken:
                  idToken,

                entry:
                  entry

              })

          }
        );


      const data =
        await response.json();


      if (!data.success) {

        if (
          String(
            data.message || ''
          )
            .toLowerCase()
            .includes('expired')
        ) {

          return refreshLogin();

        }


        throw new Error(
          data.message ||
          '新增失敗'
        );

      }


      closeModal();

      resetForm();


      showToast(
        '已加入我們的帳本 ♡'
      );


      const date =
        new Date(entry.date);


      selectedYear =
        date.getFullYear();


      selectedMonth =
        date.getMonth() + 1;


      updateMonthTitle();


      await loadLedger();


    } catch (error) {

      console.error(error);

      showToast(
        error.message ||
        '新增失敗'
      );

    } finally {

      button.disabled = false;

      button.textContent =
        '儲存 ♡';

    }

  }



  /* ==============================
     小工具
     ============================== */

  function resetForm() {

    document
      .getElementById(
        'amount'
      )
      .value = '';


    document
      .getElementById(
        'title'
      )
      .value = '';


    document
      .getElementById(
        'note'
      )
      .value = '';


    setType(
      'EXPENSE'
    );


    setToday();

  }



  function setToday() {

    const d =
      new Date();


    const year =
      d.getFullYear();


    const month =
      String(
        d.getMonth() + 1
      ).padStart(
        2,
        '0'
      );


    const day =
      String(
        d.getDate()
      ).padStart(
        2,
        '0'
      );


    document
      .getElementById(
        'entryDate'
      )
      .value =
      `${year}-${month}-${day}`;

  }



  function money(value) {

    return '$' +
      Number(
        value || 0
      )
        .toLocaleString(
          'zh-TW'
        );

  }



  function personName(value) {

    const map = {

      ADMIN001:
        '會員 A',

      WLC001:
        '會員 B',

      JOINT:
        '共同'

    };


    return map[value] ||
      escapeHtml(value || '-');

  }



  function forWhomName(value) {

    const map = {

      ADMIN001:
        '會員 A',

      WLC001:
        '會員 B',

      BOTH:
        '兩個人'

    };


    return map[value] ||
      escapeHtml(value || '-');

  }



  function escapeHtml(value) {

    return String(
      value ?? ''
    )
      .replaceAll(
        '&',
        '&amp;'
      )
      .replaceAll(
        '<',
        '&lt;'
      )
      .replaceAll(
        '>',
        '&gt;'
      )
      .replaceAll(
        '"',
        '&quot;'
      )
      .replaceAll(
        "'",
        '&#039;'
      );

  }



  function showToast(message) {

    const toast =
      document.getElementById(
        'toast'
      );


    toast.textContent =
      message;


    toast.classList.add(
      'show'
    );


    setTimeout(
      () => {

        toast.classList.remove(
          'show'
        );

      },
      2400
    );

  }



  function refreshLogin() {

    try {

      liff.logout();

    } catch (error) {}


    liff.login({

      redirectUri:
        window.location.href

    });

  }



  function goHome() {

    window.location.href =
      '/';

  }



  init();

</script>
