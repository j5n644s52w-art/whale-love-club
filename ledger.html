<!DOCTYPE html>
<html lang="zh-Hant">
<link rel="stylesheet" href="/cute-theme.css?v=1">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>我們的記帳本 | Whale Love Club</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --card: #111111;
      --card-2: #171717;
      --line: rgba(255,255,255,.09);
      --text: #f7f3ee;
      --muted: #96918b;
      --gold: #d8b184;
      --gold-soft: #f1d7b6;
      --green: #9bd3ad;
      --red: #e7a3a3;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(216,177,132,.15),
          transparent 34%
        ),
        var(--bg);

      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

      padding-bottom:
        calc(40px + env(safe-area-inset-bottom));
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(100%, 720px);
      margin: 0 auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        18px
        40px;
    }

    /* HEADER */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .back {
      border: 0;
      background: none;
      color: var(--muted);
      padding: 8px 0;
      font-size: 14px;
    }

    .brand {
      text-align: right;
    }

    .brand-small {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
    }

    .brand-name {
      font-family: Georgia, serif;
      margin-top: 4px;
      font-size: 15px;
    }

    /* TITLE */

    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Noto Serif TC", serif;
      font-weight: 400;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 13px;
    }

    /* MONTH */

    .month-control {
      margin-top: 30px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      padding: 13px 0;
    }

    .month-control button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-size: 20px;
    }

    .month-label {
      text-align: center;
    }

    #monthTitle {
      font-family: Georgia, serif;
      font-size: 18px;
      letter-spacing: 2px;
    }

    #yearTitle {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 3px;
      margin-top: 4px;
    }

    /* SUMMARY */

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
    }

    .summary-card {
      background:
        linear-gradient(
          145deg,
          #161616,
          #0e0e0e
        );

      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 17px 12px;
    }

    .summary-title {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .summary-value {
      font-family: Georgia, serif;
      font-size: 18px;
      white-space: nowrap;
    }

    .income {
      color: var(--green);
    }

    .expense {
      color: var(--red);
    }

    .balance {
      color: var(--gold-soft);
    }

    /* ADD BUTTON */

    .add-button {
      width: 100%;
      margin-top: 18px;
      border: 1px solid rgba(216,177,132,.4);

      background:
        linear-gradient(
          135deg,
          rgba(216,177,132,.15),
          rgba(216,177,132,.04)
        );

      color: var(--gold-soft);
      border-radius: 14px;
      padding: 16px;

      font-size: 14px;
      letter-spacing: 1px;
    }

    /* LIST */

    .section-head {
      margin-top: 35px;
      margin-bottom: 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-family: Georgia, serif;
      letter-spacing: 2px;
      font-size: 15px;
    }

    .section-sub {
      color: var(--muted);
      font-size: 11px;
    }

    .entries {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entry {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);

      padding: 16px;
      border-radius: 15px;

      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    .entry-title {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .entry-meta {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7;
    }

    .entry-amount {
      font-family: Georgia, serif;
      font-size: 16px;
      white-space: nowrap;
    }

    .entry-note {
      margin-top: 8px;
      font-size: 12px;
      color: #c6c1bb;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      line-height: 1.9;
      font-size: 13px;
    }

    /* LOADING */

    .loading {
      padding: 50px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* MODAL */

    .modal-mask {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.78);
      backdrop-filter: blur(8px);

      display: none;
      align-items: flex-end;
      justify-content: center;

      z-index: 100;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal {
      width: min(100%, 720px);
      max-height: 92vh;
      overflow-y: auto;

      background: #101010;
      border-top: 1px solid rgba(216,177,132,.35);

      border-radius: 26px 26px 0 0;

      padding:
        22px
        20px
        calc(24px + env(safe-area-inset-bottom));
    }

    .modal-handle {
      width: 42px;
      height: 4px;
      border-radius: 10px;
      background: #444;
      margin: 0 auto 22px;
    }

    .modal-title {
      font-family: Georgia, serif;
      font-size: 23px;
      margin-bottom: 22px;
    }

    .type-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;

      background: #080808;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .type-tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 11px;
      border-radius: 9px;
    }

    .type-tab.active {
      background: #1c1c1c;
      color: var(--gold-soft);
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .input {
      width: 100%;

      background: #090909;
      color: var(--text);

      border: 1px solid var(--line);
      border-radius: 12px;

      padding: 13px 14px;
      outline: none;
    }

    .input:focus {
      border-color: rgba(216,177,132,.65);
    }

    textarea.input {
      min-height: 85px;
      resize: vertical;
    }

    .two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .form-actions {
      display: grid;
      grid-template-columns: .7fr 1.3fr;
      gap: 10px;
      margin-top: 25px;
    }

    .cancel {
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
      border-radius: 12px;
      padding: 14px;
    }

    .save {
      border: 0;

      background:
        linear-gradient(
          135deg,
          #e3c099,
          #ad825b
        );

      color: #080808;
      font-weight: 700;

      border-radius: 12px;
      padding: 14px;
    }

    .save:disabled {
      opacity: .5;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom:
        calc(24px + env(safe-area-inset-bottom));

      transform:
        translate(-50%, 30px);

      opacity: 0;

      max-width: calc(100% - 40px);

      background: #f3e2cc;
      color: #111;

      padding: 12px 18px;
      border-radius: 999px;

      font-size: 12px;
      z-index: 999;

      transition: .25s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform:
        translate(-50%, 0);
    }

    @media (max-width: 430px) {

      h1 {
        font-size: 29px;
      }

      .summary {
        gap: 7px;
      }

      .summary-card {
        padding: 15px 9px;
      }

      .summary-value {
        font-size: 15px;
      }

      .two-cols {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
