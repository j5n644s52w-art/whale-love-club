<script>
  const LIFF_ID =
    '2011857714-fZwEK6lN';


  let idToken = '';


  /* =========================================
     初始化
     ========================================= */

  async function init() {

    try {

      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login({
          redirectUri:
            window.location.href
        });

        return;

      }


      idToken =
        liff.getIDToken();


      if (!idToken) {

        throw new Error(
          '無法取得 LINE 登入資訊'
        );

      }


      await loadMemories();


    } catch (error) {

      console.error(error);


      document
        .getElementById('timeline')
        .innerHTML = `
          <div class="empty">
            無法載入回憶相簿<br>
            ${escapeHtml(
              error.message ||
              '請稍後再試'
            )}
          </div>
        `;

    }

  }


  /* =========================================
     讀取回憶
     ========================================= */

  async function loadMemories() {

    const params =
      new URLSearchParams({
        idToken:
          idToken
      });


    const response =
      await fetch(
        '/api/memories?' +
        params.toString()
      );


    const data =
      await response.json();


    if (!data.success) {

      if (
        String(
          data.message || ''
        )
          .toLowerCase()
          .includes('expired')
      ) {

        refreshLogin();
        return;

      }


      throw new Error(
        data.message ||
        '讀取回憶失敗'
      );

    }


    const memories =
      data.memories || [];


    renderSummary(
      data.total || 0
    );


    renderMemories(
      memories
    );


    /*
     * 文字先出現，封面再批次載入。
     */
    hydrateMemoryCovers(
      memories
    ).catch(
      function(error) {
        console.error(
          '封面載入失敗',
          error
        );
      }
    );

  }


  /* =========================================
     數量
     ========================================= */

  function renderSummary(total) {

    total =
      Number(total || 0);


    document
      .getElementById('memoryCount')
      .textContent =
      total;


    document
      .getElementById('memoryLabel')
      .textContent =
      `${total} ${
        total === 1
          ? 'MEMORY'
          : 'MEMORIES'
      }`;

  }


  /* =========================================
     顯示回憶
     ========================================= */

  function renderMemories(memories) {

    const timeline =
      document.getElementById(
        'timeline'
      );


    if (!memories.length) {

      timeline.innerHTML = `
        <div class="empty">
          <div class="empty-heart">
            ♡
          </div>

          目前還沒有解鎖的回憶。<br>
          等第一張限定 NFC 卡被解鎖後，<br>
          屬於你們的故事就會從這裡開始。
        </div>
      `;

      return;

    }


    timeline.innerHTML =
      memories
        .map(
          function(memory, index) {

            const date =
              parseDate(
                memory.eventDate
              );


            return `
              <article
                class="memory"
                onclick="openMemory('${escapeJs(
                  memory.memoryId
                )}')"
              >

                <div
                  class="memory-cover"
                  data-cover-index="${index}"
                >

                  <div class="cover-placeholder">
                    ♡
                  </div>

                  ${
                    date

                      ? `
                          <div class="date-badge">
                            <div class="date-month">
                              ${date.month}
                            </div>
                            <div class="date-day">
                              ${date.day}
                            </div>
                            <div class="date-year">
                              ${date.year}
                            </div>
                          </div>
                        `

                      : ''
                  }

                </div>


                <div class="memory-body">

                  ${
                    memory.location

                      ? `
                          <div class="memory-location">
                            ♡ ${escapeHtml(
                              memory.location
                            )}
                          </div>
                        `

                      : ''
                  }


                  <div class="memory-title">
                    ${escapeHtml(
                      memory.title ||
                      'Our Memory'
                    )}
                  </div>


                  ${
                    memory.description

                      ? `
                          <div class="memory-description">
                            ${escapeHtml(
                              memory.description
                            )}
                          </div>
                        `

                      : ''
                  }


                  <div class="memory-footer">

                    <div class="unlocked">
                      ${
                        memory.relatedCardId
                          ? 'UNLOCKED BY NFC CARD'
                          : 'PRIVATE MEMORY'
                      }
                    </div>

                    <div class="view">
                      查看回憶 →
                    </div>

                  </div>

                </div>

              </article>
            `;

          }
        )
        .join('');

  }


  /* =========================================
     批次載入列表封面
     ========================================= */

  async function hydrateMemoryCovers(
    memories
  ) {

    const jobs =
      memories
        .map(
          function(memory, index) {

            const fileId =
              String(
                memory.coverImageUrl || ''
              ).trim();


            if (!fileId) {
              return null;
            }


            return {
              index:
                index,
              fileId:
                fileId
            };

          }
        )
        .filter(Boolean);


    if (!jobs.length) {
      return;
    }


    /*
     * 列表頁不要等「全部封面」讀完才一起顯示。
     * 改成小批次、漸進式載入：
     *
     * - 每批最多 2 張
     * - 同時最多跑 2 批
     * - 某一批失敗，不影響其他封面
     *
     * 這樣即使相簿很多，也會先看到前面的封面，
     * 不會整頁一直只有愛心 placeholder。
     */

    const chunks = [];


    for (
      let i = 0;
      i < jobs.length;
      i += 2
    ) {

      chunks.push(
        jobs.slice(
          i,
          i + 2
        )
      );

    }


    let cursor = 0;


    async function worker() {

      while (
        cursor < chunks.length
      ) {

        const currentIndex =
          cursor++;


        const chunk =
          chunks[
            currentIndex
          ];


        try {

          const photoMap =
            await loadPrivatePhotoMap(
              chunk.map(
                function(job) {
                  return job.fileId;
                }
              )
            );


          for (
            let j = 0;
            j < chunk.length;
            j++
          ) {

            const job =
              chunk[j];


            const src =
              photoMap[
                job.fileId
              ];


            if (!src) {
              continue;
            }


            applyMemoryCover(
              job.index,
              src
            );

          }

        } catch (error) {

          console.error(
            '部分封面載入失敗',
            error
          );

          /*
           * 不 throw。
           * 讓後面的相簿封面繼續載入。
           */

        }

      }

    }


    const workerCount =
      Math.min(
        2,
        chunks.length
      );


    const workers = [];


    for (
      let i = 0;
      i < workerCount;
      i++
    ) {

      workers.push(
        worker()
      );

    }


    await Promise.all(
      workers
    );

  }


  function applyMemoryCover(
    index,
    src
  ) {

    const cover =
      document.querySelector(
        `[data-cover-index="${index}"]`
      );


    if (
      !cover ||
      !src
    ) {
      return;
    }


    const placeholder =
      cover.querySelector(
        '.cover-placeholder'
      );


    const oldImage =
      cover.querySelector(
        'img[data-list-cover="1"]'
      );


    if (oldImage) {
      oldImage.remove();
    }


    const img =
      document.createElement(
        'img'
      );


    img.dataset.listCover =
      '1';

    img.src =
      src;

    img.alt =
      'memory';

    img.loading =
      'lazy';

    img.decoding =
      'async';


    img.style.position =
      'absolute';

    img.style.inset =
      '0';

    img.style.width =
      '100%';

    img.style.height =
      '100%';

    img.style.objectFit =
      'cover';


    img.onload =
      function() {

        if (placeholder) {

          placeholder.style.display =
            'none';

        }

      };


    img.onerror =
      function() {

        img.remove();

        if (placeholder) {

          placeholder.style.display =
            '';

        }

      };


    cover.insertBefore(
      img,
      cover.firstChild
    );

  }


  /* =========================================
     私人照片批次讀取 + Session Cache
     ========================================= */

  async function loadPrivatePhotoMap(
    fileIds
  ) {

    const uniqueIds =
      Array.from(
        new Set(
          fileIds
            .map(
              function(value) {
                return String(
                  value || ''
                ).trim();
              }
            )
            .filter(Boolean)
        )
      );


    const result = {};

    const missing = [];


    for (
      let i = 0;
      i < uniqueIds.length;
      i++
    ) {

      const fileId =
        uniqueIds[i];


      const cached =
        readPhotoCache(
          fileId
        );


      if (cached) {

        result[fileId] =
          cached;

      } else {

        missing.push(
          fileId
        );

      }

    }


    for (
      let start = 0;
      start < missing.length;
      start += 6
    ) {

      const chunk =
        missing.slice(
          start,
          start + 6
        );


      const response =
        await fetch(
          '/api/photo',
          {
            method: 'POST',
            headers: {
              'Content-Type':
                'application/json'
            },
            body:
              JSON.stringify({
                idToken:
                  idToken,
                fileIds:
                  chunk
              })
          }
        );


      const data =
        await response.json();


      if (!data.success) {

        const message =
          String(
            data.message || ''
          );


        if (
          message
            .toLowerCase()
            .includes('expired')
        ) {

          refreshLogin();

          throw new Error(
            'LINE 登入已過期'
          );

        }


        throw new Error(
          message ||
          '照片讀取失敗'
        );

      }


      const loadedPhotos =
        Array.isArray(data.photos)
          ? data.photos
          : [];


      for (
        let i = 0;
        i < loadedPhotos.length;
        i++
      ) {

        const photo =
          loadedPhotos[i];


        if (
          !photo ||
          !photo.success ||
          !photo.fileId ||
          !photo.mimeType ||
          !photo.base64Data
        ) {
          continue;
        }


        const src =
          'data:' +
          photo.mimeType +
          ';base64,' +
          photo.base64Data;


        result[
          photo.fileId
        ] = src;


        writePhotoCache(
          photo.fileId,
          src
        );

      }

    }


    return result;

  }


  function readPhotoCache(
    fileId
  ) {

    try {

      return sessionStorage.getItem(
        'wlc-photo-v2:' +
        fileId
      ) || '';

    } catch (error) {

      return '';

    }

  }


  function writePhotoCache(
    fileId,
    src
  ) {

    try {

      sessionStorage.setItem(
        'wlc-photo-v2:' +
        fileId,
        src
      );

    } catch (error) {}

  }


  /* =========================================
     新增回憶
     ========================================= */

  function openCreateMemory() {

    window.location.href =
      '/create-memory.html';

  }


  /* =========================================
     打開單篇回憶
     ========================================= */

  function openMemory(memoryId) {

    window.location.href =
      '/memory.html?id=' +
      encodeURIComponent(
        memoryId
      );

  }


  /* =========================================
     日期
     ========================================= */

  function parseDate(value) {

    if (!value) {
      return null;
    }


    const parts =
      String(value)
        .replaceAll('-', '/')
        .split('/');


    if (
      parts.length < 3
    ) {
      return null;
    }


    const year =
      parts[0];


    const monthNumber =
      Number(parts[1]);


    const day =
      String(parts[2])
        .padStart(2, '0');


    const months = [
      'JAN',
      'FEB',
      'MAR',
      'APR',
      'MAY',
      'JUN',
      'JUL',
      'AUG',
      'SEP',
      'OCT',
      'NOV',
      'DEC'
    ];


    if (
      monthNumber < 1 ||
      monthNumber > 12
    ) {
      return null;
    }


    return {
      year:
        year,
      month:
        months[
          monthNumber - 1
        ],
      day:
        day
    };

  }


  /* =========================================
     回會員中心
     ========================================= */

  function goHome() {

    window.location.href =
      '/';

  }


  /* =========================================
     LINE Token 過期
     ========================================= */

  function refreshLogin() {

    try {
      liff.logout();
    } catch (error) {}


    liff.login({
      redirectUri:
        window.location.href
    });

  }


  /* =========================================
     Toast
     ========================================= */

  function showToast(message) {

    const toast =
      document.getElementById(
        'toast'
      );


    toast.textContent =
      message;


    toast.classList.add(
      'show'
    );


    setTimeout(
      function() {

        toast
          .classList
          .remove('show');

      },
      2400
    );

  }


  /* =========================================
     安全處理
     ========================================= */

  function escapeHtml(value) {

    return String(
      value ?? ''
    )
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

  }


  function escapeJs(value) {

    return String(
      value ?? ''
    )
      .replaceAll('\\', '\\\\')
      .replaceAll("'", "\\'")
      .replaceAll('\n', '')
      .replaceAll('\r', '');

  }


  init();

</script>
