<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>回憶相簿 | Whale Love Club</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="/theme.css?v=5">
<script src="/theme.js?v=5"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #070707;
      --card: #111111;
      --line: rgba(255,255,255,.08);
      --text: #f7f3ee;
      --muted: #96918b;
      --gold: #d8b184;
      --gold-soft: #f0d5b2;
    }


    body {

      margin: 0;
      min-height: 100vh;

      background:

        radial-gradient(
          circle at 50% -5%,
          rgba(216,177,132,.17),
          transparent 30%
        ),

        #070707;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

      padding-bottom:
        calc(
          40px +
          env(safe-area-inset-bottom)
        );

    }


    button {
      font: inherit;
      cursor: pointer;
    }


    .page {

      width: min(100%, 760px);

      margin: 0 auto;

      padding:

        calc(
          20px +
          env(safe-area-inset-top)
        )

        18px
        40px;

    }


    /* =========================
       HEADER
       ========================= */

    .topbar {

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 28px;

    }


    .back {

      border: 0;
      background: transparent;

      color: var(--muted);

      padding: 8px 0;

      font-size: 14px;

    }


    .brand {
      text-align: right;
    }


    .brand-small {

      color: var(--gold);

      font-size: 10px;

      letter-spacing: 3px;

    }


    .brand-name {

      font-family: Georgia, serif;

      margin-top: 4px;

      font-size: 15px;

    }


    /* =========================
       TITLE
       ========================= */

    .eyebrow {

      color: var(--gold);

      font-size: 10px;

      letter-spacing: 4px;

      margin-bottom: 10px;

    }


    h1 {

      margin: 0;

      font-family:
        Georgia,
        "Noto Serif TC",
        serif;

      font-weight: 400;

      font-size: 31px;

      letter-spacing: 2px;

    }


    .subtitle {

      margin-top: 8px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.8;

    }


    /* =========================
       SUMMARY
       ========================= */

    .summary {

      margin-top: 27px;

      padding: 20px;

      border-radius: 20px;

      border:
        1px solid
        rgba(216,177,132,.2);

      background:

        linear-gradient(
          145deg,
          rgba(216,177,132,.08),
          rgba(255,255,255,.015)
        );

      display: flex;

      justify-content: space-between;

      align-items: flex-end;

    }


    .summary-small {

      font-size: 10px;

      letter-spacing: 3px;

      color: var(--muted);

    }


    .summary-number {

      margin-top: 7px;

      font-family: Georgia, serif;

      font-size: 29px;

      color: var(--gold-soft);

    }


    .summary-heart {

      font-family: Georgia, serif;

      font-size: 30px;

      color: var(--gold);

    }


    /* =========================
       SECTION
       ========================= */

    .section-head {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-top: 34px;

      margin-bottom: 17px;

    }


    .section-title {

      font-family: Georgia, serif;

      font-size: 14px;

      letter-spacing: 2px;

    }


    .section-sub {

      color: var(--muted);

      font-size: 11px;

    }

    /* =========================
   ADD MEMORY
   ========================= */

.add-memory-btn {

  width: 100%;

  margin-top: 18px;

  padding: 16px 18px;

  border-radius: 18px;

  border:
    1px solid
    rgba(216,177,132,.28);

  background:
    linear-gradient(
      145deg,
      rgba(216,177,132,.12),
      rgba(255,255,255,.025)
    );

  color: var(--text);

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  font-size: 14px;

  letter-spacing: 1px;

  transition:
    transform .15s ease,
    border-color .15s ease;
}


.add-memory-btn:active {

  transform:
    scale(.985);

}


.add-memory-plus {

  color: var(--gold);

  font-size: 22px;

  line-height: 1;

}


.add-memory-text {

  color: var(--gold-soft);

}


    /* =========================
       TIMELINE
       ========================= */

    .timeline {

      position: relative;

      display: flex;

      flex-direction: column;

      gap: 20px;

    }


    .memory {

      position: relative;

      overflow: hidden;

      border-radius: 21px;

      border: 1px solid var(--line);

      background:

        linear-gradient(
          145deg,
          #151515,
          #0b0b0b
        );

      cursor: pointer;

      transition:
        transform .15s ease,
        border-color .15s ease;

    }


    .memory:active {

      transform:
        scale(.985);

    }


    .memory-cover {

      position: relative;

      height: 230px;

      overflow: hidden;

      background:

        radial-gradient(
          circle at 50% 30%,
          rgba(216,177,132,.15),
          transparent 45%
        ),

        #101010;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .memory-cover img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    .cover-placeholder {

      width: 74px;

      height: 74px;

      border-radius: 50%;

      border:
        1px solid
        rgba(216,177,132,.2);

      display: flex;

      align-items: center;

      justify-content: center;

      font-family: Georgia, serif;

      font-size: 26px;

      color: var(--gold);

    }


    .date-badge {

      position: absolute;

      top: 14px;

      left: 14px;

      min-width: 63px;

      padding: 9px 11px;

      border-radius: 12px;

      background:
        rgba(7,7,7,.75);

      backdrop-filter:
        blur(10px);

      border:
        1px solid
        rgba(255,255,255,.08);

      text-align: center;

    }


    .date-month {

      font-size: 9px;

      letter-spacing: 2px;

      color: var(--gold);

    }


    .date-day {

      margin-top: 2px;

      font-family: Georgia, serif;

      font-size: 22px;

    }


    .date-year {

      margin-top: 2px;

      font-size: 9px;

      letter-spacing: 2px;

      color: var(--muted);

    }


    .memory-body {

      padding: 18px;

    }


    .memory-location {

      color: var(--gold);

      font-size: 10px;

      letter-spacing: 1.5px;

      margin-bottom: 7px;

    }


    .memory-title {

      font-family:
        Georgia,
        "Noto Serif TC",
        serif;

      font-size: 21px;

      line-height: 1.45;

    }


    .memory-description {

      margin-top: 10px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.8;

      display: -webkit-box;

      -webkit-line-clamp: 2;

      -webkit-box-orient: vertical;

      overflow: hidden;

    }


    .memory-footer {

      margin-top: 16px;

      padding-top: 14px;

      border-top:
        1px solid
        var(--line);

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .unlocked {

      color: var(--muted);

      font-size: 10px;

      letter-spacing: 1px;

    }


    .view {

      color: var(--gold-soft);

      font-size: 11px;

    }


    /* =========================
       EMPTY / LOADING
       ========================= */

    .loading,
    .empty {

      border:
        1px dashed
        var(--line);

      border-radius: 18px;

      padding: 46px 22px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.9;

    }


    .empty-heart {

      font-family: Georgia, serif;

      font-size: 29px;

      color: #4e443b;

      margin-bottom: 12px;

    }


    /* =========================
       TOAST
       ========================= */

    .toast {

      position: fixed;

      left: 50%;

      bottom:
        calc(
          25px +
          env(safe-area-inset-bottom)
        );

      transform:
        translate(-50%, 30px);

      opacity: 0;

      background: #f2dfc6;

      color: #111;

      padding: 12px 18px;

      border-radius: 999px;

      z-index: 999;

      font-size: 12px;

      transition: .25s;

      pointer-events: none;

      max-width:
        calc(100% - 40px);

      text-align: center;

    }


    .toast.show {

      opacity: 1;

      transform:
        translate(-50%, 0);

    }


    @media (max-width: 430px) {

      .memory-cover {
        height: 210px;
      }

      h1 {
        font-size: 29px;
      }

    }

  </style>

    </div>

    </h1>

<script>
  const LIFF_ID =
    '2011857714-fZwEK6lN';


  let idToken = '';


  /* =========================================
     初始化
     ========================================= */

  async function init() {

    try {

      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login({
          redirectUri:
            window.location.href
        });

        return;

      }


      idToken =
        liff.getIDToken();


      if (!idToken) {

        throw new Error(
          '無法取得 LINE 登入資訊'
        );

      }


      await loadMemories();


    } catch (error) {

      console.error(error);


      document
        .getElementById('timeline')
        .innerHTML = `
          <div class="empty">
            無法載入回憶相簿<br>
            ${escapeHtml(
              error.message ||
              '請稍後再試'
            )}
          </div>
        `;

    }

  }


  /* =========================================
     讀取回憶
     ========================================= */

  async function loadMemories() {

    const params =
      new URLSearchParams({
        idToken:
          idToken
      });


    const response =
      await fetch(
        '/api/memories?' +
        params.toString()
      );


    const data =
      await response.json();


    if (!data.success) {

      if (
        String(
          data.message || ''
        )
          .toLowerCase()
          .includes('expired')
      ) {

        refreshLogin();
        return;

      }


      throw new Error(
        data.message ||
        '讀取回憶失敗'
      );

    }


    const memories =
      data.memories || [];


    renderSummary(
      data.total || 0
    );


    renderMemories(
      memories
    );


    /*
     * 文字先出現，封面再批次載入。
     */
    hydrateMemoryCovers(
      memories
    ).catch(
      function(error) {
        console.error(
          '封面載入失敗',
          error
        );
      }
    );

  }


  /* =========================================
     數量
     ========================================= */

  function renderSummary(total) {

    total =
      Number(total || 0);


    document
      .getElementById('memoryCount')
      .textContent =
      total;


    document
      .getElementById('memoryLabel')
      .textContent =
      `${total} ${
        total === 1
          ? 'MEMORY'
          : 'MEMORIES'
      }`;

  }


  /* =========================================
     顯示回憶
     ========================================= */

  function renderMemories(memories) {

    const timeline =
      document.getElementById(
        'timeline'
      );


    if (!memories.length) {

      timeline.innerHTML = `
        <div class="empty">
          <div class="empty-heart">
            ♡
          </div>

          目前還沒有解鎖的回憶。<br>
          等第一張限定 NFC 卡被解鎖後，<br>
          屬於你們的故事就會從這裡開始。
        </div>
      `;

      return;

    }


    timeline.innerHTML =
      memories
        .map(
          function(memory, index) {

            const date =
              parseDate(
                memory.eventDate
              );


            return `
              <article
                class="memory"
                onclick="openMemory('${escapeJs(
                  memory.memoryId
                )}')"
              >

                <div
                  class="memory-cover"
                  data-cover-index="${index}"
                >

                  <div class="cover-placeholder">
                    ♡
                  </div>

                  ${
                    date

                      ? `
                          <div class="date-badge">
                            <div class="date-month">
                              ${date.month}
                            </div>
                            <div class="date-day">
                              ${date.day}
                            </div>
                            <div class="date-year">
                              ${date.year}
                            </div>
                          </div>
                        `

                      : ''
                  }

                </div>


                <div class="memory-body">

                  ${
                    memory.location

                      ? `
                          <div class="memory-location">
                            ♡ ${escapeHtml(
                              memory.location
                            )}
                          </div>
                        `

                      : ''
                  }


                  <div class="memory-title">
                    ${escapeHtml(
                      memory.title ||
                      'Our Memory'
                    )}
                  </div>


                  ${
                    memory.description

                      ? `
                          <div class="memory-description">
                            ${escapeHtml(
                              memory.description
                            )}
                          </div>
                        `

                      : ''
                  }


                  <div class="memory-footer">

                    <div class="unlocked">
                      ${
                        memory.relatedCardId
                          ? 'UNLOCKED BY NFC CARD'
                          : 'PRIVATE MEMORY'
                      }
                    </div>

                    <div class="view">
                      查看回憶 →
                    </div>

                  </div>

                </div>

              </article>
            `;

          }
        )
        .join('');

  }


  /* =========================================
     列表封面：可視區載入 + 永久圖片快取
     ========================================= */

  async function hydrateMemoryCovers(
    memories
  ) {

    const jobs =
      memories
        .map(
          function(memory, index) {

            const fileId =
              String(
                memory.coverImageUrl || ''
              ).trim();


            if (!fileId) {
              return null;
            }


            const element =
              document.querySelector(
                `[data-cover-index="${index}"]`
              );


            if (!element) {
              return null;
            }


            return {
              index:
                index,
              fileId:
                fileId,
              element:
                element
            };

          }
        )
        .filter(Boolean);


    if (!jobs.length) {
      return;
    }


    /*
     * 只載入目前畫面附近的封面。
     * rootMargin 600px 代表使用者快滑到之前就先抓，
     * 不會一次把整頁所有封面都下載。
     */

    const pending = [];

    const queuedIds =
      new Set();

    let activeBatches = 0;

    let flushTimer = null;


    function enqueue(job) {

      if (
        !job ||
        queuedIds.has(
          job.fileId
        )
      ) {
        return;
      }


      queuedIds.add(
        job.fileId
      );


      pending.push(
        job
      );


      if (flushTimer) {
        clearTimeout(
          flushTimer
        );
      }


      flushTimer =
        setTimeout(
          flushQueue,
          50
        );

    }


    function flushQueue() {

      flushTimer = null;


      while (
        activeBatches < 2 &&
        pending.length > 0
      ) {

        const batch =
          pending.splice(
            0,
            4
          );


        activeBatches++;


        loadPrivatePhotoMap(
          batch.map(
            function(job) {
              return job.fileId;
            }
          )
        )
          .then(
            function(photoMap) {

              for (
                let i = 0;
                i < batch.length;
                i++
              ) {

                const job =
                  batch[i];


                const src =
                  photoMap[
                    job.fileId
                  ];


                if (src) {

                  applyMemoryCover(
                    job.index,
                    src
                  );

                }

              }

            }
          )
          .catch(
            function(error) {

              console.error(
                '部分封面載入失敗',
                error
              );

            }
          )
          .finally(
            function() {

              activeBatches--;


              if (
                pending.length > 0
              ) {

                flushQueue();

              }

            }
          );

      }

    }


    if (
      'IntersectionObserver' in window
    ) {

      const observer =
        new IntersectionObserver(
          function(entries) {

            for (
              let i = 0;
              i < entries.length;
              i++
            ) {

              const entry =
                entries[i];


              if (!entry.isIntersecting) {
                continue;
              }


              const index =
                Number(
                  entry.target.dataset.coverIndex
                );


              const job =
                jobs.find(
                  function(item) {
                    return item.index === index;
                  }
                );


              if (job) {

                observer.unobserve(
                  entry.target
                );


                enqueue(
                  job
                );

              }

            }

          },
          {
            root:
              null,
            rootMargin:
              '600px 0px',
            threshold:
              0.01
          }
        );


      for (
        let i = 0;
        i < jobs.length;
        i++
      ) {

        observer.observe(
          jobs[i].element
        );

      }

    } else {

      /*
       * 舊瀏覽器 fallback：
       * 沒有 IntersectionObserver 時仍然分批載入。
       */

      for (
        let i = 0;
        i < jobs.length;
        i++
      ) {

        enqueue(
          jobs[i]
        );

      }

    }

  }


  function applyMemoryCover(
    index,
    src
  ) {

    const cover =
      document.querySelector(
        `[data-cover-index="${index}"]`
      );


    if (
      !cover ||
      !src
    ) {
      return;
    }


    const placeholder =
      cover.querySelector(
        '.cover-placeholder'
      );


    const oldImage =
      cover.querySelector(
        'img[data-list-cover="1"]'
      );


    if (oldImage) {
      oldImage.remove();
    }


    const img =
      document.createElement(
        'img'
      );


    img.dataset.listCover =
      '1';

    img.src =
      src;

    img.alt =
      'memory';

    img.loading =
      'lazy';

    img.decoding =
      'async';


    img.style.position =
      'absolute';

    img.style.inset =
      '0';

    img.style.width =
      '100%';

    img.style.height =
      '100%';

    img.style.objectFit =
      'cover';


    img.onload =
      function() {

        if (placeholder) {

          placeholder.style.display =
            'none';

        }

      };


    img.onerror =
      function() {

        img.remove();

        if (placeholder) {

          placeholder.style.display =
            '';

        }

      };


    cover.insertBefore(
      img,
      cover.firstChild
    );

  }


  /* =========================================
     私人照片批次讀取 + IndexedDB 永久快取
     ========================================= */

  const PHOTO_CACHE_DB_NAME =
    'wlc-private-photo-cache';

  const PHOTO_CACHE_DB_VERSION =
    1;

  const PHOTO_CACHE_STORE =
    'photos';

  const PHOTO_CACHE_MAX_BYTES =
    80 * 1024 * 1024;

  const PHOTO_CACHE_MAX_ITEMS =
    120;

  let photoCacheDbPromise =
    null;

  let cacheCleanupScheduled =
    false;

  const activeObjectUrls =
    new Set();


  async function loadPrivatePhotoMap(
    fileIds
  ) {

    const uniqueIds =
      Array.from(
        new Set(
          fileIds
            .map(
              function(value) {
                return String(
                  value || ''
                ).trim();
              }
            )
            .filter(Boolean)
        )
      );


    const result = {};

    const missing = [];


    const cachedEntries =
      await Promise.all(
        uniqueIds.map(
          async function(fileId) {

            const cached =
              await readPhotoCache(
                fileId
              );


            return {
              fileId:
                fileId,
              src:
                cached
            };

          }
        )
      );


    for (
      let i = 0;
      i < cachedEntries.length;
      i++
    ) {

      const item =
        cachedEntries[i];


      if (item.src) {

        result[
          item.fileId
        ] = item.src;

      } else {

        missing.push(
          item.fileId
        );

      }

    }


    for (
      let start = 0;
      start < missing.length;
      start += 6
    ) {

      const chunk =
        missing.slice(
          start,
          start + 6
        );


      const response =
        await fetch(
          '/api/photo',
          {
            method: 'POST',
            headers: {
              'Content-Type':
                'application/json'
            },
            body:
              JSON.stringify({
                idToken:
                  idToken,
                fileIds:
                  chunk
              })
          }
        );


      const data =
        await response.json();


      if (!data.success) {

        const message =
          String(
            data.message || ''
          );


        if (
          message
            .toLowerCase()
            .includes('expired')
        ) {

          refreshLogin();

          throw new Error(
            'LINE 登入已過期'
          );

        }


        throw new Error(
          message ||
          '照片讀取失敗'
        );

      }


      const loadedPhotos =
        Array.isArray(data.photos)
          ? data.photos
          : [];


      for (
        let i = 0;
        i < loadedPhotos.length;
        i++
      ) {

        const photo =
          loadedPhotos[i];


        if (
          !photo ||
          !photo.success ||
          !photo.fileId ||
          !photo.mimeType ||
          !photo.base64Data
        ) {
          continue;
        }


        const blob =
          base64ToBlob(
            photo.base64Data,
            photo.mimeType
          );


        const src =
          createTrackedObjectUrl(
            blob
          );


        result[
          photo.fileId
        ] = src;


        writePhotoCache(
          photo.fileId,
          blob,
          photo.mimeType
        ).catch(
          function(error) {
            console.warn(
              '照片快取寫入失敗',
              error
            );
          }
        );

      }

    }


    return result;

  }


  function openPhotoCacheDb() {

    if (photoCacheDbPromise) {
      return photoCacheDbPromise;
    }


    photoCacheDbPromise =
      new Promise(
        function(resolve, reject) {

          if (!('indexedDB' in window)) {

            reject(
              new Error(
                'IndexedDB unavailable'
              )
            );

            return;

          }


          const request =
            indexedDB.open(
              PHOTO_CACHE_DB_NAME,
              PHOTO_CACHE_DB_VERSION
            );


          request.onupgradeneeded =
            function(event) {

              const db =
                event.target.result;


              if (
                !db.objectStoreNames.contains(
                  PHOTO_CACHE_STORE
                )
              ) {

                const store =
                  db.createObjectStore(
                    PHOTO_CACHE_STORE,
                    {
                      keyPath:
                        'fileId'
                    }
                  );


                store.createIndex(
                  'lastAccess',
                  'lastAccess',
                  {
                    unique:
                      false
                  }
                );

              }

            };


          request.onsuccess =
            function() {
              resolve(
                request.result
              );
            };


          request.onerror =
            function() {
              reject(
                request.error ||
                new Error(
                  'IndexedDB open failed'
                )
              );
            };

        }
      );


    return photoCacheDbPromise;

  }


  async function readPhotoCache(
    fileId
  ) {

    try {

      const db =
        await openPhotoCacheDb();


      const record =
        await new Promise(
          function(resolve, reject) {

            const transaction =
              db.transaction(
                PHOTO_CACHE_STORE,
                'readonly'
              );


            const store =
              transaction.objectStore(
                PHOTO_CACHE_STORE
              );


            const request =
              store.get(
                fileId
              );


            request.onsuccess =
              function() {
                resolve(
                  request.result || null
                );
              };


            request.onerror =
              function() {
                reject(
                  request.error
                );
              };

          }
        );


      if (
        !record ||
        !record.blob
      ) {
        return '';
      }


      touchPhotoCache(
        fileId
      );


      return createTrackedObjectUrl(
        record.blob
      );


    } catch (error) {

      /*
       * 如果裝置不支援 IndexedDB，
       * 退回原本 Session Cache。
       */

      try {

        return sessionStorage.getItem(
          'wlc-photo-v2:' +
          fileId
        ) || '';

      } catch (fallbackError) {

        return '';

      }

    }

  }


  async function writePhotoCache(
    fileId,
    blob,
    mimeType
  ) {

    try {

      const db =
        await openPhotoCacheDb();


      await new Promise(
        function(resolve, reject) {

          const transaction =
            db.transaction(
              PHOTO_CACHE_STORE,
              'readwrite'
            );


          const store =
            transaction.objectStore(
              PHOTO_CACHE_STORE
            );


          store.put({
            fileId:
              fileId,
            blob:
              blob,
            mimeType:
              mimeType || blob.type || '',
            size:
              Number(blob.size || 0),
            lastAccess:
              Date.now()
          });


          transaction.oncomplete =
            function() {
              resolve();
            };


          transaction.onerror =
            function() {
              reject(
                transaction.error
              );
            };

        }
      );


      schedulePhotoCacheCleanup();


    } catch (error) {

      /*
       * IndexedDB 寫入失敗時不影響圖片顯示。
       * 不再把大張 Base64 強塞 localStorage。
       */

    }

  }


  function touchPhotoCache(
    fileId
  ) {

    openPhotoCacheDb()
      .then(
        function(db) {

          const transaction =
            db.transaction(
              PHOTO_CACHE_STORE,
              'readwrite'
            );


          const store =
            transaction.objectStore(
              PHOTO_CACHE_STORE
            );


          const request =
            store.get(
              fileId
            );


          request.onsuccess =
            function() {

              const record =
                request.result;


              if (!record) {
                return;
              }


              record.lastAccess =
                Date.now();


              store.put(
                record
              );

            };

        }
      )
      .catch(
        function() {}
      );

  }


  function schedulePhotoCacheCleanup() {

    if (cacheCleanupScheduled) {
      return;
    }


    cacheCleanupScheduled =
      true;


    setTimeout(
      function() {

        cacheCleanupScheduled =
          false;


        cleanupPhotoCache()
          .catch(
            function() {}
          );

      },
      1500
    );

  }


  async function cleanupPhotoCache() {

    const db =
      await openPhotoCacheDb();


    const records =
      await new Promise(
        function(resolve, reject) {

          const transaction =
            db.transaction(
              PHOTO_CACHE_STORE,
              'readonly'
            );


          const store =
            transaction.objectStore(
              PHOTO_CACHE_STORE
            );


          const request =
            store.getAll();


          request.onsuccess =
            function() {
              resolve(
                request.result || []
              );
            };


          request.onerror =
            function() {
              reject(
                request.error
              );
            };

        }
      );


    records.sort(
      function(a, b) {
        return Number(
          a.lastAccess || 0
        ) - Number(
          b.lastAccess || 0
        );
      }
    );


    let totalBytes =
      records.reduce(
        function(sum, item) {
          return sum +
            Number(
              item.size || 0
            );
        },
        0
      );


    let totalItems =
      records.length;


    const idsToDelete = [];


    for (
      let i = 0;
      i < records.length;
      i++
    ) {

      if (
        totalBytes <= PHOTO_CACHE_MAX_BYTES &&
        totalItems <= PHOTO_CACHE_MAX_ITEMS
      ) {
        break;
      }


      idsToDelete.push(
        records[i].fileId
      );


      totalBytes -=
        Number(
          records[i].size || 0
        );


      totalItems--;

    }


    if (!idsToDelete.length) {
      return;
    }


    await new Promise(
      function(resolve, reject) {

        const transaction =
          db.transaction(
            PHOTO_CACHE_STORE,
            'readwrite'
          );


        const store =
          transaction.objectStore(
            PHOTO_CACHE_STORE
          );


        for (
          let i = 0;
          i < idsToDelete.length;
          i++
        ) {

          store.delete(
            idsToDelete[i]
          );

        }


        transaction.oncomplete =
          function() {
            resolve();
          };


        transaction.onerror =
          function() {
            reject(
              transaction.error
            );
          };

      }
    );

  }


  function base64ToBlob(
    base64Data,
    mimeType
  ) {

    const binary =
      atob(
        base64Data
      );


    const bytes =
      new Uint8Array(
        binary.length
      );


    for (
      let i = 0;
      i < binary.length;
      i++
    ) {

      bytes[i] =
        binary.charCodeAt(
          i
        );

    }


    return new Blob(
      [bytes],
      {
        type:
          mimeType ||
          'application/octet-stream'
      }
    );

  }


  function createTrackedObjectUrl(
    blob
  ) {

    const url =
      URL.createObjectURL(
        blob
      );


    activeObjectUrls.add(
      url
    );


    return url;

  }


  window.addEventListener(
    'beforeunload',
    function() {

      activeObjectUrls.forEach(
        function(url) {

          try {
            URL.revokeObjectURL(
              url
            );
          } catch (error) {}

        }
      );


      activeObjectUrls.clear();

    }
  );


  /* =========================================
     新增回憶
     ========================================= */

  function openCreateMemory() {

    window.location.href =
      '/create-memory.html';

  }


  /* =========================================
     打開單篇回憶
     ========================================= */

  function openMemory(memoryId) {

    window.location.href =
      '/memory.html?id=' +
      encodeURIComponent(
        memoryId
      );

  }


  /* =========================================
     日期
     ========================================= */

  function parseDate(value) {

    if (!value) {
      return null;
    }


    const parts =
      String(value)
        .replaceAll('-', '/')
        .split('/');


    if (
      parts.length < 3
    ) {
      return null;
    }


    const year =
      parts[0];


    const monthNumber =
      Number(parts[1]);


    const day =
      String(parts[2])
        .padStart(2, '0');


    const months = [
      'JAN',
      'FEB',
      'MAR',
      'APR',
      'MAY',
      'JUN',
      'JUL',
      'AUG',
      'SEP',
      'OCT',
      'NOV',
      'DEC'
    ];


    if (
      monthNumber < 1 ||
      monthNumber > 12
    ) {
      return null;
    }


    return {
      year:
        year,
      month:
        months[
          monthNumber - 1
        ],
      day:
        day
    };

  }


  /* =========================================
     回會員中心
     ========================================= */

  function goHome() {

    window.location.href =
      '/';

  }


  /* =========================================
     LINE Token 過期
     ========================================= */

  function refreshLogin() {

    try {
      liff.logout();
    } catch (error) {}


    liff.login({
      redirectUri:
        window.location.href
    });

  }


  /* =========================================
     Toast
     ========================================= */

  function showToast(message) {

    const toast =
      document.getElementById(
        'toast'
      );


    toast.textContent =
      message;


    toast.classList.add(
      'show'
    );


    setTimeout(
      function() {

        toast
          .classList
          .remove('show');

      },
      2400
    );

  }


  /* =========================================
     安全處理
     ========================================= */

  function escapeHtml(value) {

    return String(
      value ?? ''
    )
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

  }


  function escapeJs(value) {

    return String(
      value ?? ''
    )
      .replaceAll('\\', '\\\\')
      .replaceAll("'", "\\'")
      .replaceAll('\n', '')
      .replaceAll('\r', '');

  }


  init();
