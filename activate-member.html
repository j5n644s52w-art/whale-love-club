<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>
  會員啟用 | Whale Love Club
</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="/theme.css?v=6">
<script src="/theme.js?v=6"></script>
<script src="/fast-cache.js?v=1"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  background:

    radial-gradient(
      circle at 50% -10%,
      rgba(215,177,132,.20),
      transparent 35%
    ),

    #070707;

  color: #f7f3ed;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;

  padding-bottom:
    calc(
      36px +
      env(safe-area-inset-bottom)
    );

}

.page {

  width:
    min(
      100%,
      680px
    );

  margin:
    auto;

  padding:

    calc(
      22px +
      env(safe-area-inset-top)
    )

    18px

    40px;

}

.brand {

  text-align:
    center;

  margin-top:
    4px;

}

.brand small {

  color:
    #d7b184;

  letter-spacing:
    3px;

  font-size:
    9px;

}

.brand div {

  margin-top:
    6px;

  font-family:
    Georgia,
    serif;

  font-size:
    15px;

}

.panel {

  margin-top:
    34px;

  text-align:
    center;

  padding:
    30px 20px;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:
    24px;

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    );

}

.symbol {

  font-size:
    38px;

  color:
    #d7b184;

  margin-bottom:
    16px;

}

.eyebrow {

  font-size:
    10px;

  letter-spacing:
    4px;

  color:
    #d7b184;

}

h1 {

  margin:
    10px 0 0;

  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-size:
    30px;

  font-weight:
    400;

}

.note {

  margin:
    14px auto 0;

  max-width:
    460px;

  color:
    #a39c95;

  font-size:
    13px;

  line-height:
    1.9;

}

.notice {

  margin-top:
    22px;

  padding:
    15px;

  border-radius:
    15px;

  background:
    rgba(215,177,132,.06);

  border:
    1px solid
    rgba(215,177,132,.18);

  color:
    #d8c4ab;

  font-size:
    12px;

  line-height:
    1.8;

  text-align:
    left;

}

.actions {

  margin-top:
    22px;

  display:
    grid;

  gap:
    10px;

}

.btn {

  width:
    100%;

  border-radius:
    14px;

  padding:
    14px 16px;

  font-size:
    14px;

  text-align:
    center;

  cursor:
    pointer;

}

.btn-primary {

  border:
    0;

  background:

    linear-gradient(
      135deg,
      #e3c099,
      #a87b55
    );

  color:
    #080808;

  font-weight:
    800;

}

.btn-primary:disabled {

  opacity:
    .5;

  cursor:
    default;

}

.btn-secondary {

  border:
    1px solid
    rgba(215,177,132,.25);

  background:
    rgba(215,177,132,.05);

  color:
    #f0d5b2;

  text-decoration:
    none;

}

.spinner {

  width:
    34px;

  height:
    34px;

  margin:
    24px auto 4px;

  border-radius:
    50%;

  border:
    2px solid
    rgba(215,177,132,.18);

  border-top-color:
    #d7b184;

  animation:
    spin .9s linear infinite;

}

@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}

.hidden {
  display:
    none !important;
}

.error {

  margin-top:
    28px;

  padding:
    20px;

  border-radius:
    18px;

  text-align:
    center;

  border:
    1px solid
    rgba(231,168,168,.25);

  background:
    rgba(231,168,168,.05);

  color:
    #e7a8a8;

}

.error strong {

  display:
    block;

  color:
    #f2c1c1;

  font-size:
    17px;

  margin-bottom:
    9px;

}

.success {

  margin-top:
    28px;

  padding:
    24px;

  border-radius:
    20px;

  text-align:
    center;

  border:
    1px solid
    rgba(215,177,132,.28);

  background:
    rgba(215,177,132,.06);

}

.success .big {

  font-size:
    38px;

  color:
    #d7b184;

}

.success h2 {

  margin:
    12px 0 0;

  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-weight:
    400;

}

.success p {

  color:
    #aaa19a;

  font-size:
    13px;

  line-height:
    1.8;

}


.friendship-status {
  margin-top: 14px;
  color: #b9afa6;
  font-size: 12px;
  line-height: 1.8;
}

</style>


<style id="wlc-theme-bridge">
html body {
  background:
    radial-gradient(
      circle at 50% -10%,
      color-mix(in srgb, var(--wlc-accent) 20%, transparent),
      transparent 35%
    ),
    var(--wlc-bg) !important;
  color: var(--wlc-text) !important;
}
.panel,
.success {
  background: var(--wlc-panel) !important;
  border-color: var(--wlc-border-soft) !important;
}
.brand small,
.symbol,
.eyebrow,
.success .big {
  color: var(--wlc-accent) !important;
}
.note,
.friendship-status,
.success p {
  color: var(--wlc-text-muted) !important;
}
.notice {
  background: color-mix(in srgb, var(--wlc-accent) 8%, transparent) !important;
  border-color: var(--wlc-border) !important;
  color: var(--wlc-text-soft) !important;
}
.btn-primary {
  background: linear-gradient(
    135deg,
    var(--wlc-accent-strong),
    var(--wlc-accent-dark)
  ) !important;
}
.btn-secondary {
  background: var(--wlc-panel-2) !important;
  color: var(--wlc-text) !important;
  border-color: var(--wlc-border) !important;
}
</style>

</head>


<body>


<main class="page">


  <div class="brand">

    <small>
      ♡ PRIVATE MEMBERS
    </small>

    <div>
      Whale Love Club
    </div>

  </div>



  <!-- LOADING -->

  <section
    id="loadingState"
    class="panel"
  >

    <div class="symbol">
      ◇
    </div>

    <div class="eyebrow">
      MEMBER · NFC ACTIVATION
    </div>

    <h1>
      正在確認會員卡
    </h1>

    <div class="note">
      請稍候，正在確認 LINE 登入狀態。
    </div>

    <div class="spinner"></div>

  </section>



  <!-- CONFIRM -->

  <section
    id="confirmState"
    class="panel hidden"
  >

    <div class="symbol">
      ♡
    </div>

    <div class="eyebrow">
      MEMBERSHIP INVITATION
    </div>

    <h1>
      啟用 Whale Love Club
    </h1>

    <div class="note">

      這張 NFC 會員卡會把目前登入的 LINE 帳號，
      綁定到卡片指定的會員帳號。

    </div>

    <div class="notice">

      綁定後，這個 LINE 帳號將作為會員身分使用。

      <br>

      一張會員卡只能完成一次正式綁定。

    </div>

    <div class="actions">

      <button
        id="activateButton"
        class="btn btn-primary"
        type="button"
        onclick="activateMember()"
      >
        確認啟用會員
      </button>

      <a
        class="btn btn-secondary"
        href="/"
      >
        暫時不要啟用
      </a>

    </div>

  </section>



  <!-- SUCCESS -->

  <section
    id="successState"
    class="success hidden"
  >

    <div class="big">
      ♡
    </div>

    <h2>
      會員啟用成功
    </h2>

    <p id="successMessage">

      你的 LINE 已完成會員綁定。

    </p>

    <div
      id="friendshipMessage"
      class="friendship-status"
    >
      接下來會開啟 LINE 的加入好友視窗。
    </div>

    <div class="actions">

      <button
        id="friendButton"
        class="btn btn-primary"
        type="button"
        onclick="requestOfficialAccountFriendship()"
      >
        加入 ♡鯨魚小舖
      </button>

      <a
        class="btn btn-secondary"
        href="/"
      >
        進入會員中心
      </a>

    </div>

  </section>



  <!-- ERROR -->

  <section
    id="errorState"
    class="error hidden"
  >

    <strong id="errorTitle">
      無法啟用會員
    </strong>

    <div id="errorMessage"></div>

  </section>


</main>



<script>


const LIFF_ID =
  '2011857714-fZwEK6lN';


let idToken = '';

let accessToken = '';

let token = '';

let friendshipPromptRunning = false;



/* =========================================
   初始化
   ========================================= */

async function init() {

  try {

    token =

      new URLSearchParams(
        window.location.search
      )
      .get(
        'token'
      )

      || '';


    if (!token) {

      throw new Error(
        'MISSING_TOKEN'
      );

    }



    await liff.init({

      liffId:
        LIFF_ID

    });



    if (!liff.isLoggedIn()) {

      liff.login({

        redirectUri:
          window.location.href

      });

      return;

    }



    /*
     * 新版：
     * 優先取得 Access Token。
     *
     * Access Token 會送到 Vercel，
     * 由 Vercel 向 LINE 官方驗證。
     */
    accessToken =
      liff.getAccessToken() ||
      '';


    /*
     * ID Token 保留當備援，
     * 但不再優先依賴它。
     */
    idToken =
      liff.getIDToken() ||
      '';



    if (
      !accessToken &&
      !idToken
    ) {

      throw new Error(
        'NO_LINE_TOKEN'
      );

    }



    document
      .getElementById(
        'loadingState'
      )
      .classList
      .add(
        'hidden'
      );



    document
      .getElementById(
        'confirmState'
      )
      .classList
      .remove(
        'hidden'
      );


  } catch (error) {

    console.error(
      'Activation page init error:',
      error
    );


    showError(

      error.message ||

      'INIT_FAILED'

    );

  }

}



/* =========================================
   啟用會員
   ========================================= */

async function activateMember() {

  const button =

    document
      .getElementById(
        'activateButton'
      );


  try {

    button.disabled =
      true;


    button.textContent =
      '啟用中...';



    /*
     * 每次按按鈕時重新讀一次，
     * 避免使用頁面剛開啟時的舊值。
     */
    accessToken =
      liff.getAccessToken() ||
      accessToken;


    idToken =
      liff.getIDToken() ||
      idToken;



    const response =

      await fetch(
        '/api/activate-member',
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:

            JSON.stringify({

              accessToken:
                accessToken,

              idToken:
                idToken,

              token:
                token

            })

        }
      );



    const data =
      await response.json();



    if (!data.success) {

      throw new Error(

        data.message ||

        data.status ||

        'ACTIVATION_FAILED'

      );

    }



    document
      .getElementById(
        'confirmState'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'errorState'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'successState'
      )
      .classList
      .remove(
        'hidden'
      );



    document
      .getElementById(
        'successMessage'
      )
      .textContent =

      data.memberNo

        ? (
            '會員 ' +
            data.memberNo +
            ' 已完成綁定。'
          )

        : '你的 LINE 已完成會員綁定。';


    /*
     * 會員綁定成功後，自動開啟
     * LINE 官方帳號加入好友視窗。
     *
     * 這段失敗不會影響會員綁定結果。
     */
    setTimeout(
      function() {
        requestOfficialAccountFriendship(
          true
        );
      },
      350
    );


  } catch (error) {

    console.error(
      'Member activation failed:',
      error
    );


    button.disabled =
      false;


    button.textContent =
      '確認啟用會員';


    showError(

      error.message ||

      'ACTIVATION_FAILED'

    );

  }

}




/* =========================================
   LINE 官方帳號好友邀請
   ========================================= */

async function requestOfficialAccountFriendship(
  automatic
) {

  if (friendshipPromptRunning) {
    return;
  }


  const message =
    document.getElementById(
      'friendshipMessage'
    );


  const button =
    document.getElementById(
      'friendButton'
    );


  try {

    if (
      !liff ||
      typeof liff.requestFriendship !==
        'function'
    ) {

      if (message) {
        message.textContent =
          '目前 LINE 版本無法直接開啟好友視窗，請稍後再按一次「加入 ♡鯨魚小舖」。';
      }

      return;

    }


    friendshipPromptRunning =
      true;


    if (button) {
      button.disabled =
        true;

      button.textContent =
        '正在開啟 LINE...';
    }


    if (message) {
      message.textContent =
        automatic
          ? '正在開啟 ♡鯨魚小舖 的加入好友視窗...'
          : '正在重新開啟加入好友視窗...';
    }


    /*
     * 不指定 officialAccount，
     * 直接使用 LINE Developers Console
     * 中與目前 MINI App channel 綁定的
     * LINE Official Account。
     */
    await liff.requestFriendship();


    if (message) {
      message.textContent =
        '好友視窗已處理完成；如果尚未加入，可以再按一次「加入 ♡鯨魚小舖」。';
    }


  } catch (error) {

    console.warn(
      'requestFriendship failed:',
      error
    );


    if (message) {
      message.textContent =
        '會員已啟用成功；若沒有出現好友視窗，請確認 MINI App 已連結 ♡鯨魚小舖，並再按一次按鈕。';
    }


  } finally {

    friendshipPromptRunning =
      false;


    if (button) {
      button.disabled =
        false;

      button.textContent =
        '加入 ♡鯨魚小舖';
    }

  }

}



/* =========================================
   顯示錯誤
   ========================================= */

function showError(code) {

  document
    .getElementById(
      'loadingState'
    )
    .classList
    .add(
      'hidden'
    );


  const translated =

    translateError(
      code
    );


  document
    .getElementById(
      'errorTitle'
    )
    .textContent =
      translated.title;


  document
    .getElementById(
      'errorMessage'
    )
    .textContent =
      translated.message;


  document
    .getElementById(
      'errorState'
    )
    .classList
    .remove(
      'hidden'
    );

}



/* =========================================
   錯誤訊息
   ========================================= */

function translateError(code) {

  const value =

    String(
      code || ''
    );


  if (
    value.includes(
      'This LINE account is already bound'
    ) ||
    value.includes(
      'LINE_ALREADY_BOUND'
    )
  ) {

    return {

      title:
        '這個 LINE 已綁定其他會員',

      message:
        '目前登入的 LINE 已經有會員身分，不能再綁定另一個會員帳號。'

    };

  }


  if (
    value.includes(
      'This member account is already bound'
    ) ||
    value.includes(
      'MEMBER_ALREADY_BOUND'
    )
  ) {

    return {

      title:
        '會員已經綁定',

      message:
        '這張卡指定的會員帳號已經綁定其他 LINE。'

    };

  }


  if (
    value.includes(
      'Target member does not exist'
    ) ||
    value.includes(
      'MEMBER_NOT_FOUND'
    )
  ) {

    return {

      title:
        '找不到會員',

      message:
        '這張卡指定的會員編號不存在。'

    };

  }


  if (
    value.includes(
      'CARD_ALREADY_USED'
    ) ||
    value.includes(
      'already been activated'
    )
  ) {

    return {

      title:
        '會員卡已使用',

      message:
        '這張 NFC 會員卡已經完成過會員啟用。'

    };

  }


  if (
    value.includes(
      'CARD_NOT_AVAILABLE'
    ) ||
    value.includes(
      'not available'
    )
  ) {

    return {

      title:
        '會員卡目前無法使用',

      message:
        '請確認 NFCCards 裡這張卡的 Status 是否為 UNUSED。'

    };

  }


  if (
    value.includes(
      'INVALID_CARD_TYPE'
    ) ||
    value.includes(
      'cannot activate membership'
    )
  ) {

    return {

      title:
        '卡片類型不正確',

      message:
        '這張 NFC 卡不是 MEMBER_BIND 會員綁定卡。'

    };

  }


  if (
    value.includes(
      'Invalid membership card'
    ) ||
    value.includes(
      'INVALID_CARD'
    ) ||
    value.includes(
      'MISSING_TOKEN'
    )
  ) {

    return {

      title:
        '找不到會員卡',

      message:
        'Token 不正確，或這張卡目前不存在。'

    };

  }


  if (
    value.includes(
      'NO_LINE_TOKEN'
    )
  ) {

    return {

      title:
        'LINE 登入失敗',

      message:
        '請關閉頁面後，再從 LINE 重新開啟。'

    };

  }



  return {

    title:
      '無法啟用會員',

    message:
      value ||
      '請稍後再試一次。'

  };

}



init();


</script>


</body>
</html>
