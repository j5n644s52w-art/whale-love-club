<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鯨魚日報 | Whale Love Club</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#080808;
  --panel:#111;
  --panel2:#151515;
  --line:rgba(255,255,255,.08);
  --text:#f5f1eb;
  --muted:#9d968e;
  --gold:#d7b184;
  --gold-soft:rgba(215,177,132,.11);
  --danger:#d98b8b;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
}
button{font:inherit}
.page{
  width:min(100%,760px);
  margin:auto;
  padding:calc(18px + env(safe-area-inset-top)) 16px 40px;
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.back{
  border:1px solid var(--line);background:#101010;color:#cfc7be;
  border-radius:999px;padding:9px 13px;font-size:12px;
}
.brand{text-align:right}
.brand-small{font-size:9px;letter-spacing:2.5px;color:var(--gold)}
.brand-name{font-family:Georgia,serif;font-size:14px;margin-top:4px}

.hero{margin-top:32px}
.eyebrow{font-size:10px;letter-spacing:4px;color:var(--gold)}
h1{font-family:Georgia,"Noto Serif TC",serif;font-size:34px;font-weight:400;margin:10px 0 0}
.subtitle{color:var(--muted);font-size:13px;line-height:1.8;margin-top:10px}

.summary{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:22px;
}
.summary-card{
  border:1px solid var(--line);background:linear-gradient(145deg,#121212,#0d0d0d);
  border-radius:17px;padding:14px;
}
.summary-label{font-size:9px;letter-spacing:1.5px;color:#867f78}
.summary-value{font-family:Georgia,serif;font-size:24px;margin-top:7px;color:var(--gold)}

.toolbar{margin-top:22px}
.search{
  width:100%;border:1px solid var(--line);outline:none;
  border-radius:16px;background:#101010;color:var(--text);
  padding:14px 15px;font-size:14px;
}
.chips{
  display:flex;gap:8px;overflow-x:auto;padding:13px 0 4px;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:#101010;color:#aaa29b;
  border-radius:999px;padding:9px 13px;font-size:11px;
}
.chip.active{background:var(--gold-soft);border-color:rgba(215,177,132,.35);color:#e6c7a1}

.section-head{
  display:flex;align-items:flex-end;justify-content:space-between;margin:26px 2px 12px;
}
.section-title{font-size:11px;letter-spacing:2.3px;color:#c9c0b8}
.section-count{font-size:10px;color:#736d67}

.grid{display:grid;gap:13px}
.card{
  border:1px solid var(--line);border-radius:22px;overflow:hidden;
  background:linear-gradient(145deg,#131313,#0c0c0c);
}
.card-visual{
  min-height:112px;
  background:
    radial-gradient(circle at 84% 10%,rgba(215,177,132,.16),transparent 32%),
    linear-gradient(135deg,#1b1815,#101010 58%,#151515);
  padding:16px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
}
.category-badge{
  border:1px solid rgba(215,177,132,.25);background:rgba(0,0,0,.25);
  border-radius:999px;padding:7px 10px;color:#ddbc94;font-size:10px;letter-spacing:1px;
}
.score{text-align:right}
.score-num{font-family:Georgia,serif;font-size:28px;color:var(--gold)}
.score-label{font-size:8px;letter-spacing:1.4px;color:#7f7770}
.card-body{padding:16px}
.card-title{
  font-family:Georgia,"Noto Serif TC",serif;
  font-size:21px;line-height:1.45;font-weight:400;margin:0;
}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.meta span{
  font-size:10px;color:#a59d95;border:1px solid rgba(255,255,255,.06);
  border-radius:999px;padding:6px 9px;background:#101010;
}
.desc{
  margin-top:12px;color:#8f8881;font-size:12px;line-height:1.75;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-actions{
  margin-top:15px;display:grid;grid-template-columns:1fr auto;gap:9px;
}
.want{
  border:1px solid rgba(215,177,132,.28);background:var(--gold-soft);color:#e2c09a;
  border-radius:14px;padding:12px 14px;font-size:12px;font-weight:600;
}
.want.saved{background:#d7b184;color:#12100e}
.source{
  border:1px solid var(--line);background:#101010;color:#aaa29b;
  border-radius:14px;padding:12px 13px;font-size:12px;text-decoration:none;
}
.source.disabled{opacity:.35;pointer-events:none}
.empty,.loading,.error{
  border:1px solid var(--line);border-radius:20px;padding:28px 18px;text-align:center;
  color:#8f8881;background:#0f0f0f;font-size:13px;line-height:1.8;
}
.error{color:#d8aaa8}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  background:#ece2d5;color:#201b17;border-radius:999px;
  padding:10px 15px;font-size:12px;opacity:0;pointer-events:none;
  transition:.22s;z-index:30;white-space:nowrap;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.match-badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:11px;padding:7px 10px;border-radius:999px;
  background:rgba(215,177,132,.14);
  border:1px solid rgba(215,177,132,.28);
  color:#e6c59e;font-size:10px;letter-spacing:1.1px;
}
.match-overlay{
  position:fixed;inset:0;z-index:80;
  display:flex;align-items:center;justify-content:center;
  padding:22px;background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
}
.match-modal{
  width:min(100%,430px);
  border:1px solid rgba(215,177,132,.28);
  background:linear-gradient(155deg,#191613,#0c0c0c 62%);
  border-radius:28px;padding:30px 22px;text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.55);
}
.match-heart{font-size:44px;color:var(--gold)}
.match-kicker{margin-top:12px;color:var(--gold);font-size:10px;letter-spacing:4px}
.match-title{
  margin:11px 0 0;font-family:Georgia,"Noto Serif TC",serif;
  font-size:30px;font-weight:400
}
.match-event{margin-top:12px;color:#bdb4ab;font-size:13px;line-height:1.7}
.match-close{
  width:100%;margin-top:22px;border:0;border-radius:15px;
  padding:13px 15px;background:var(--gold);color:#17120e;font-weight:700
}
.hidden{display:none!important}

@media(min-width:650px){
  .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<main class="page">
  <div class="topbar">
    <button class="back" onclick="location.href='/'">← 會員中心</button>
    <div class="brand">
      <div class="brand-small">♡ PRIVATE MEMBERS</div>
      <div class="brand-name">Whale Love Club</div>
    </div>
  </div>

  <section class="hero">
    <div class="eyebrow">WHALE DAILY · DISCOVER</div>
    <h1>鯨魚日報</h1>
    <div class="subtitle">把近期值得一起去看看的活動、展覽、快閃、音樂與市集收在這裡。</div>
  </section>

  <section class="summary">
    <div class="summary-card">
      <div class="summary-label">ACTIVE</div>
      <div class="summary-value" id="totalCount">–</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">WANT TO GO</div>
      <div class="summary-value" id="savedCount">–</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">HOTTEST</div>
      <div class="summary-value" id="topScore">–</div>
    </div>
  </section>

  <section class="toolbar">
    <input id="searchInput" class="search" type="search" placeholder="搜尋活動、城市、地點…" oninput="render()">
    <div class="chips" id="chips"></div>
  </section>

  <div class="section-head">
    <div class="section-title">TODAY'S PICKS</div>
    <div class="section-count" id="resultCount">0 ITEMS</div>
  </div>

  <div id="stateBox" class="loading">正在整理今天的鯨魚日報…</div>
  <section id="grid" class="grid hidden"></section>
</main>

<div id="matchOverlay" class="match-overlay hidden" onclick="closeMatch(event)">
  <div class="match-modal" onclick="event.stopPropagation()">
    <div class="match-heart">♡</div>
    <div class="match-kicker">IT'S A MATCH!</div>
    <h2 class="match-title">你們都想去</h2>
    <div id="matchEvent" class="match-event"></div>
    <button class="match-close" onclick="closeMatch()">收進約會清單 ♡</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const LIFF_ID = '2011857714-fZwEK6lN';

let idToken = '';
let items = [];
let activeCategory = 'ALL';
let busyIds = new Set();

const CATEGORY_LABELS = {
  ALL: '全部',
  IP: 'IP / 快閃',
  EXHIBITION: '展覽',
  MUSIC: '音樂',
  MARKET: '市集',
  CAFE: '咖啡',
  TRAVEL: '景點',
  SEASONAL: '季節',
  EVENT: '活動'
};

async function init() {
  try {
    setStateMessage('正在初始化 LINE 登入…');

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login({
        redirectUri:
          window.location.origin +
          window.location.pathname +
          window.location.search
      });
      return;
    }

    setStateMessage('正在確認會員身分…');

    idToken =
      liff.getIDToken();

    if (!idToken) {
      throw new Error('無法取得 LINE 登入資訊');
    }

    setStateMessage('正在載入活動…');

    await loadDiscover();

  } catch (error) {
    console.error(error);
    showError(
      [
        error && error.name
          ? error.name
          : '',
        error && error.message
          ? error.message
          : '鯨魚日報載入失敗'
      ]
      .filter(Boolean)
      .join(': ')
    );
  }
}

async function loadDiscover() {
  const response = await fetch('/api/member', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      idToken,
      operation: 'discoverList'
    })
  });

  const data = await response.json();

  if (!data.success) {
    if (String(data.message || '').toLowerCase().includes('expired')) {
      return refreshLogin();
    }
    throw new Error(data.message || '無法讀取活動');
  }

  items = Array.isArray(data.items) ? data.items : [];

  document.getElementById('totalCount').textContent = items.length;
  document.getElementById('savedCount').textContent =
    items.filter(x => !!x.saved).length;
  document.getElementById('topScore').textContent =
    items.length ? Math.max(...items.map(x => Number(x.trendScore || 0))) : 0;

  buildChips();
  render();
}

function buildChips() {
  const available = new Set(items.map(x => normalizeCategory(x.category)));
  const order = ['ALL','IP','EXHIBITION','MUSIC','MARKET','CAFE','TRAVEL','SEASONAL','EVENT'];

  document.getElementById('chips').innerHTML =
    order
      .filter(x => x === 'ALL' || available.has(x))
      .map(x => `
        <button
          class="chip ${activeCategory === x ? 'active' : ''}"
          onclick="setCategory('${x}')"
        >${CATEGORY_LABELS[x] || x}</button>
      `)
      .join('');
}

function setCategory(category) {
  activeCategory = category;
  buildChips();
  render();
}

function render() {
  const q = String(document.getElementById('searchInput').value || '')
    .trim()
    .toLowerCase();

  const filtered = items.filter(item => {
    const category = normalizeCategory(item.category);
    const categoryOk = activeCategory === 'ALL' || category === activeCategory;

    const haystack = [
      item.title,
      item.city,
      item.venue,
      item.description,
      item.sourceName
    ].join(' ').toLowerCase();

    return categoryOk && (!q || haystack.includes(q));
  });

  document.getElementById('resultCount').textContent =
    `${filtered.length} ITEMS`;

  const state = document.getElementById('stateBox');
  const grid = document.getElementById('grid');

  if (!filtered.length) {
    grid.classList.add('hidden');
    state.className = 'empty';
    state.textContent = '目前沒有符合條件的活動。';
    state.classList.remove('hidden');
    return;
  }

  state.classList.add('hidden');
  grid.classList.remove('hidden');

  grid.innerHTML = filtered.map(cardTemplate).join('');
}

function cardTemplate(item) {
  const title = escapeHtml(item.title || '未命名活動');
  const category = normalizeCategory(item.category);
  const categoryLabel = CATEGORY_LABELS[category] || category || '活動';
  const city = escapeHtml(item.city || '地點待確認');
  const venue = escapeHtml(item.venue || '');
  const date = formatDateRange(item.startDate, item.endDate);
  const desc = escapeHtml(cleanDescription(item.description || ''));
  const score = Number(item.trendScore || 0);
  const saved = !!item.saved;
  const itemId = escapeAttr(item.itemId || '');
  const sourceUrl = safeHttpUrl(item.sourceUrl || '');

  return `
    <article class="card">
      <div class="card-visual">
        <div class="category-badge">${escapeHtml(categoryLabel)}</div>
        <div class="score">
          <div class="score-num">${score}</div>
          <div class="score-label">TREND SCORE</div>
        </div>
      </div>

      <div class="card-body">
        <h2 class="card-title">${title}</h2>

        ${item.matched
          ? `<div class="match-badge">♡ IT'S A MATCH</div>`
          : ''}

        <div class="meta">
          <span>📍 ${city}</span>
          ${venue ? `<span>${venue}</span>` : ''}
          ${date ? `<span>🗓 ${escapeHtml(date)}</span>` : ''}
        </div>

        ${desc ? `<div class="desc">${desc}</div>` : ''}

        <div class="card-actions">
          <button
            id="want-${itemId}"
            class="want ${saved ? 'saved' : ''}"
            onclick="toggleWant('${itemId}')"
          >
            ${saved ? '♥ 已想去' : '♡ 想去'}
          </button>

          <a
            class="source ${sourceUrl ? '' : 'disabled'}"
            ${sourceUrl ? `href="${escapeAttr(sourceUrl)}" target="_blank" rel="noopener noreferrer"` : ''}
          >
            查看來源
          </a>
        </div>
      </div>
    </article>
  `;
}

async function toggleWant(itemId) {
  if (!itemId || busyIds.has(itemId)) return;

  const item = items.find(x => String(x.itemId) === String(itemId));
  if (!item) return;

  busyIds.add(itemId);

  const button = document.getElementById('want-' + itemId);
  if (button) {
    button.disabled = true;
    button.textContent = '更新中…';
  }

  try {
    const response = await fetch('/api/member', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        idToken,
        operation: 'discoverToggle',
        itemId
      })
    });

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.message || '更新失敗');
    }

    item.saved =
      !!data.saved;

    item.matched =
      !!data.matched;


    document.getElementById('savedCount').textContent =
      items.filter(x => !!x.saved).length;


    render();


    if (
      data.saved &&
      data.matched
    ) {

      showMatch(
        item.title ||
        '這個活動'
      );

    } else {

      showToast(
        data.saved
          ? '已加入「想去」♡'
          : '已從「想去」移除'
      );

    }
  } catch (error) {
    console.error(error);
    showToast(error.message || '更新失敗');
    render();
  } finally {
    busyIds.delete(itemId);
  }
}

function normalizeCategory(value) {
  const c = String(value || '').trim().toUpperCase();

  if (c === 'IP') return 'IP';
  if (c === 'EXHIBITION' || c === 'EXPO') return 'EXHIBITION';
  if (c === 'MUSIC') return 'MUSIC';
  if (c === 'MARKET') return 'MARKET';
  if (c === 'CAFE') return 'CAFE';
  if (c === 'TRAVEL' || c === 'SPOT') return 'TRAVEL';
  if (c === 'SEASONAL') return 'SEASONAL';
  return 'EVENT';
}

function formatDateRange(start, end) {
  const a = formatDate(start);
  const b = formatDate(end);

  if (a && b && a !== b) return `${a} – ${b}`;
  return a || b || '';
}

function formatDate(value) {
  if (!value) return '';

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) {
    return String(value);
  }

  return new Intl.DateTimeFormat('zh-TW', {
    month: 'numeric',
    day: 'numeric'
  }).format(d);
}

function cleanDescription(text) {
  return String(text || '')
    .replace(/此項目由 Whale Love Club Discover Trend Radar 自動整理。?/g, '')
    .trim();
}

function safeHttpUrl(value) {
  const s =
    String(value || '').trim();

  if (!s) {
    return '';
  }

  if (
    /^https?:\/\//i.test(s)
  ) {
    return s;
  }

  return '';
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function setStateMessage(message) {
  const state =
    document.getElementById('stateBox');

  if (!state) {
    return;
  }

  state.className =
    'loading';

  state.textContent =
    String(message || '');
}


function showError(message) {
  const state = document.getElementById('stateBox');
  document.getElementById('grid').classList.add('hidden');
  state.className = 'error';
  state.textContent = message;
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(window.__wlcToastTimer);
  window.__wlcToastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 1700);
}

function showMatch(title) {

  document
    .getElementById(
      'matchEvent'
    )
    .textContent =
      String(
        title || ''
      );


  document
    .getElementById(
      'matchOverlay'
    )
    .classList
    .remove(
      'hidden'
    );

}


function closeMatch(event) {

  if (
    event &&
    event.target &&
    event.currentTarget &&
    event.target !== event.currentTarget
  ) {
    return;
  }


  document
    .getElementById(
      'matchOverlay'
    )
    .classList
    .add(
      'hidden'
    );

}


function refreshLogin() {
  try {
    liff.logout();
  } catch (e) {}

  const cleanUrl =
    window.location.origin +
    window.location.pathname +
    window.location.search;

  window.location.href =
    cleanUrl;
}

init();
</script>
</body>
</html>
