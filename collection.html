<script>

  /*
   * 跟 index.html、ledger.html
   * 使用同一組 LIFF ID
   */
  const LIFF_ID =
    '2011857712-lXq9lJFT';


  let idToken = '';

  let currentMemoryId = '';

  let cardData = [];

  let cacheKey = '';

  let hasCachedData = false;


  /* =========================================
     初始化
     ========================================= */

  async function init() {

    try {

      /*
       * 1. 初始化 LIFF
       */
      await liff.init({
        liffId: LIFF_ID
      });


      /*
       * 2. 如果沒登入 LINE
       */
      if (!liff.isLoggedIn()) {

        liff.login({
          redirectUri:
            window.location.href
        });

        return;
      }


      /*
       * 3. 取得 LINE ID Token
       */
      idToken =
        liff.getIDToken();


      if (!idToken) {

        throw new Error(
          '無法取得 LINE 登入資訊'
        );

      }


      /*
       * 4. 取得目前 LINE 身分
       *
       * 只用來建立「本機快取代號」
       * 不會顯示在頁面。
       */
      const decoded =
        liff.getDecodedIDToken();


      const lineSub =
        decoded?.sub || 'unknown';


      /*
       * 每個 LINE 帳號有自己的快取
       * 避免 ADMIN 與 MEMBER
       * 在同一台裝置看到彼此資料。
       */
      cacheKey =
        await makeCacheKey(
          lineSub
        );


      /*
       * 5. 先讀手機上次保存的收藏
       *
       * 如果有：
       * → 馬上顯示
       *
       * 不必等 Apps Script
       */
      const cached =
        loadCachedCollection();


      if (cached) {

        hasCachedData = true;

        cardData =
          cached.cards || [];


        renderSummary(
          cached,
          true
        );


        renderCards(
          cardData
        );

      }


      /*
       * 6. 背景抓最新資料
       */
      await loadCollection();


    } catch (error) {

      console.error(error);


      /*
       * 如果已有快取，
       * 即使伺服器暫時慢，
       * 也不要把畫面清掉。
       */
      if (hasCachedData) {

        showToast(
          '目前顯示上次更新的收藏 ♡'
        );

        return;
      }


      document
        .getElementById(
          'cardGrid'
        )
        .innerHTML = `

          <div class="empty">

            無法載入卡片收藏<br>

            ${escapeHtml(
              error.message ||
              '請稍後再試'
            )}

          </div>

        `;

    }

  }



  /* =========================================
     讀取最新收藏
     ========================================= */

  async function loadCollection() {

    /*
     * 沒有快取時才顯示 Loading。
     *
     * 有快取時就繼續顯示舊資料，
     * 背景更新即可。
     */
    if (!hasCachedData) {

      document
        .getElementById(
          'cardGrid'
        )
        .innerHTML = `

          <div class="loading">
            正在讀取卡片收藏...
          </div>

        `;

    }


    try {

      const params =
        new URLSearchParams({

          idToken:
            idToken,

          /*
           * 防止瀏覽器使用舊 API 結果
           */
          t:
            Date.now()

        });


      /*
       * 最多等 20 秒。
       *
       * 如果 Apps Script 偶爾冷啟動很慢，
       * 有快取的情況下仍然可以正常使用。
       */
      const response =
        await fetchWithTimeout(

          '/api/collection?' +
          params.toString(),

          20000

        );


      const data =
        await response.json();


      if (!data.success) {


        const message =
          String(
            data.message || ''
          );


        /*
         * Token 過期
         */
        if (
          message
            .toLowerCase()
            .includes('expired')
        ) {

          refreshLogin();

          return;

        }


        throw new Error(
          message ||
          '讀取收藏失敗'
        );

      }


      /*
       * 最新資料回來
       */
      cardData =
        data.cards || [];


      /*
       * 更新畫面
       */
      renderSummary(
        data,
        false
      );


      renderCards(
        cardData
      );


      /*
       * 儲存在手機
       *
       * 下次打開頁面直接讀這份。
       */
      saveCachedCollection(
        data
      );


      hasCachedData = true;


    } catch (error) {

      console.error(error);


      /*
       * 如果有舊資料，
       * API 失敗也不用整頁報錯。
       */
      if (hasCachedData) {

        renderCachedStatus();

        showToast(
          '更新稍慢，已顯示上次收藏'
        );

        return;

      }


      throw error;

    }

  }



  /* =========================================
     收藏進度
     ========================================= */

  function renderSummary(
    data,
    refreshing = false
  ) {

    const total =
      Number(
        data.total || 0
      );


    const collected =
      Number(
        data.collected || 0
      );


    const locked =
      Number(
        data.locked || 0
      );


    const percent =
      total > 0

        ? Math.round(
            collected /
            total *
            100
          )

        : 0;


    document
      .getElementById(
        'collectionCount'
      )
      .textContent =
      `${collected} / ${total}`;


    document
      .getElementById(
        'collectionPercent'
      )
      .textContent =
      `${percent}%`;


    document
      .getElementById(
        'lockedCount'
      )
      .textContent =

      refreshing

        ? `${locked} LOCKED · 更新中`

        : `${locked} LOCKED`;


    document
      .getElementById(
        'progressFill'
      )
      .style
      .width =
      `${percent}%`;

  }



  function renderCachedStatus() {

    const el =
      document.getElementById(
        'lockedCount'
      );


    if (
      el.textContent.includes(
        '更新中'
      )
    ) {

      el.textContent =
        el.textContent.replace(
          ' · 更新中',
          ''
        );

    }

  }



  /* =========================================
     顯示所有卡片
     ========================================= */

  function renderCards(cards) {

    const grid =
      document.getElementById(
        'cardGrid'
      );


    /*
     * 完全沒有卡片
     */
    if (!cards.length) {

      grid.innerHTML = `

        <div class="empty">

          收藏冊目前還沒有卡片 ♡<br>

          之後建立節日限定 NFC 卡，
          就會出現在這裡。

        </div>

      `;

      return;

    }


    /*
     * 產生卡片
     */
    grid.innerHTML =
      cards
        .map(
          (card, index) => {


            /*
             * =========================
             * LOCKED
             * =========================
             */

            if (
              !card.collected
            ) {

              return `

                <div class="locked-card">

                  <div class="lock-symbol">
                    ?
                  </div>

                  <div class="locked-title">
                    ???
                  </div>

                  <div class="locked-text">
                    LOCKED
                  </div>

                </div>

              `;

            }


            /*
             * =========================
             * 已收藏
             * =========================
             */

            const image =
              card.cardImageUrl

                ? `

                  <img

                    src="${escapeAttribute(
                      card.cardImageUrl
                    )}"

                    alt="card"

                    loading="lazy"

                    onerror="
                      this.parentElement.innerHTML =
                      '<div class=&quot;card-placeholder&quot;>♠</div>'
                    "

                  >

                `

                : `

                  <div class="card-placeholder">
                    ♠
                  </div>

                `;


            return `

              <div

                class="
                  collection-card
                  collected
                "

                onclick="
                  openDetail(${index})
                "

              >

                <div class="card-image">

                  ${image}

                </div>


                <div class="card-body">


                  <div class="card-edition">

                    ${escapeHtml(

                      card.edition ||
                      'LIMITED EDITION'

                    )}

                  </div>


                  <div class="card-name">

                    ${escapeHtml(

                      card.cardName ||
                      'Whale Love Card'

                    )}

                  </div>


                  <div class="card-meta">

                    ${
                      card.collectedAt

                        ? `Collected · ${
                            escapeHtml(
                              card.collectedAt
                            )
                          }`

                        : 'Collected'
                    }

                  </div>


                </div>

              </div>

            `;

          }
        )
        .join('');

  }



  /* =========================================
     卡片詳細資料
     ========================================= */

  function openDetail(index) {

    const card =
      cardData[index];


    if (
      !card ||
      !card.collected
    ) {

      return;

    }


    currentMemoryId =
      card.memoryId || '';


    const detailImage =
      document.getElementById(
        'detailImage'
      );


    /*
     * 卡面
     */
    if (card.cardImageUrl) {

      detailImage.innerHTML = `

        <img

          src="${escapeAttribute(
            card.cardImageUrl
          )}"

          alt="card"

        >

      `;

    } else {

      detailImage.innerHTML = `

        <div class="card-placeholder">
          ♠
        </div>

      `;

    }


    /*
     * Edition
     */
    document
      .getElementById(
        'detailEdition'
      )
      .textContent =

      card.edition ||
      'LIMITED EDITION';


    /*
     * 卡名
     */
    document
      .getElementById(
        'detailTitle'
      )
      .textContent =

      card.cardName ||
      'Whale Love Card';


    /*
     * 收藏日期
     */
    document
      .getElementById(
        'detailCollected'
      )
      .textContent =

      card.collectedAt ||
      '-';


    /*
     * 發行日期
     */
    document
      .getElementById(
        'detailRelease'
      )
      .textContent =

      card.releaseDate ||
      '-';


    /*
     * 獎勵
     */
    document
      .getElementById(
        'detailReward'
      )
      .textContent =

      rewardText(card);


    /*
     * Reward 狀態
     */
    document
      .getElementById(
        'detailRewardStatus'
      )
      .textContent =

      card.rewardClaimed

        ? 'REDEEMED'

        : 'AVAILABLE';


    /*
     * 有 Memory 才顯示按鈕
     */
    const memoryButton =
      document.getElementById(
        'memoryButton'
      );


    memoryButton.style.display =

      currentMemoryId

        ? 'block'

        : 'none';


    /*
     * 打開詳情
     */
    document
      .getElementById(
        'modalMask'
      )
      .classList
      .add('show');

  }



  function closeDetail() {

    document
      .getElementById(
        'modalMask'
      )
      .classList
      .remove('show');


    currentMemoryId = '';

  }



  /* =========================================
     回憶相簿
     ========================================= */

  function openMemory() {

    if (!currentMemoryId) {
      return;
    }


    /*
     * 下一階段建立 memory.html 後，
     * 改成：
     *
     * window.location.href =
     *   '/memory.html?id=' +
     *   encodeURIComponent(
     *     currentMemoryId
     *   );
     */

    showToast(
      '回憶相簿功能下一步開放 ♡'
    );

  }



  /* =========================================
     Reward 文字
     ========================================= */

  function rewardText(card) {

    const type =
      String(
        card.rewardType || ''
      );


    const amount =
      Number(
        card.rewardAmount || 0
      );


    if (!type) {

      return 'SPECIAL CARD';

    }


    if (
      type ===
      'LOVE_POINTS'
    ) {

      return (
        'Love Points +' +
        amount
      );

    }


    if (
      type ===
      'MASSAGE_POINTS'
    ) {

      return (
        'Massage +' +
        amount
      );

    }


    if (
      type ===
      'COUPON'
    ) {

      return (
        'Coupon ×' +
        amount
      );

    }


    return (

      type +

      (
        amount
          ? ' +' + amount
          : ''
      )

    );

  }



  /* =========================================
     本機快取
     ========================================= */

  async function makeCacheKey(
    lineSub
  ) {

    const prefix =
      'WLC_CARD_COLLECTION_V2';


    try {

      /*
       * 不直接把 LINE User ID
       * 當 localStorage key。
       *
       * 先 SHA-256。
       */
      const input =
        new TextEncoder()
          .encode(
            lineSub
          );


      const digest =
        await crypto
          .subtle
          .digest(
            'SHA-256',
            input
          );


      const hash =
        Array
          .from(
            new Uint8Array(
              digest
            )
          )
          .map(
            byte =>
              byte
                .toString(16)
                .padStart(2, '0')
          )
          .join('');


      return (
        prefix +
        '_' +
        hash.substring(
          0,
          20
        )
      );


    } catch (error) {

      /*
       * 極少數瀏覽器如果不支援
       * Web Crypto，
       * 使用共用 fallback。
       */
      return (
        prefix +
        '_FALLBACK'
      );

    }

  }



  function saveCachedCollection(
    data
  ) {

    if (!cacheKey) {
      return;
    }


    try {

      localStorage.setItem(

        cacheKey,

        JSON.stringify({

          savedAt:
            Date.now(),

          data:
            data

        })

      );

    } catch (error) {

      console.warn(
        'Cache save failed',
        error
      );

    }

  }



  function loadCachedCollection() {

    if (!cacheKey) {
      return null;
    }


    try {

      const raw =
        localStorage.getItem(
          cacheKey
        );


      if (!raw) {
        return null;
      }


      const cache =
        JSON.parse(raw);


      if (
        !cache ||
        !cache.data
      ) {

        return null;

      }


      /*
       * 最多保存 30 天。
       *
       * 每次打開仍然會背景更新，
       * 所以平常資料會一直保持最新。
       */
      const maxAge =
        30 *
        24 *
        60 *
        60 *
        1000;


      if (
        Date.now() -
        Number(
          cache.savedAt || 0
        )
        >
        maxAge
      ) {

        localStorage.removeItem(
          cacheKey
        );

        return null;

      }


      return cache.data;


    } catch (error) {

      console.warn(
        'Cache read failed',
        error
      );

      return null;

    }

  }



  /* =========================================
     Fetch timeout
     ========================================= */

  async function fetchWithTimeout(
    url,
    timeout
  ) {

    const controller =
      new AbortController();


    const timer =
      setTimeout(
        () => {

          controller.abort();

        },
        timeout
      );


    try {

      return await fetch(
        url,
        {

          signal:
            controller.signal,

          cache:
            'no-store'

        }
      );


    } catch (error) {

      if (
        error.name ===
        'AbortError'
      ) {

        throw new Error(
          '伺服器讀取時間過久'
        );

      }


      throw error;


    } finally {

      clearTimeout(
        timer
      );

    }

  }



  /* =========================================
     LINE Token 更新
     ========================================= */

  function refreshLogin() {

    try {

      liff.logout();

    } catch (error) {}


    liff.login({

      redirectUri:
        window.location.href

    });

  }



  /* =========================================
     返回會員中心
     ========================================= */

  function goHome() {

    window.location.href =
      '/';

  }



  /* =========================================
     Toast
     ========================================= */

  function showToast(message) {

    const toast =
      document.getElementById(
        'toast'
      );


    toast.textContent =
      message;


    toast.classList.add(
      'show'
    );


    setTimeout(
      () => {

        toast
          .classList
          .remove(
            'show'
          );

      },
      2400
    );

  }



  /* =========================================
     HTML 安全處理
     ========================================= */

  function escapeHtml(value) {

    return String(
      value ?? ''
    )

      .replaceAll(
        '&',
        '&amp;'
      )

      .replaceAll(
        '<',
        '&lt;'
      )

      .replaceAll(
        '>',
        '&gt;'
      )

      .replaceAll(
        '"',
        '&quot;'
      )

      .replaceAll(
        "'",
        '&#039;'
      );

  }



  function escapeAttribute(value) {

    return escapeHtml(
      value
    );

  }



  /* =========================================
     START
     ========================================= */

  init();

</script>
