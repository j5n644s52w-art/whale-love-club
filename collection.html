<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>卡片收藏 | Whale Love Club</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="/theme.css?v=6">
<script src="/theme.js?v=6"></script>
<script src="/fast-cache.js?v=1"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --bg: #070707;
      --card: #111111;
      --card2: #171717;

      --line:
        rgba(255,255,255,.08);

      --text:
        #f7f3ed;

      --muted:
        #918b84;

      --gold:
        #d7b184;

      --gold-soft:
        #f0d5b2;

    }


    body {

      margin: 0;

      min-height: 100vh;

      background:

        radial-gradient(
          circle at 50% -5%,
          rgba(215,177,132,.18),
          transparent 30%
        ),

        radial-gradient(
          circle at 85% 30%,
          rgba(120,80,45,.08),
          transparent 30%
        ),

        #070707;

      color:
        var(--text);

      font-family:

        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

      padding-bottom:
        calc(
          40px +
          env(safe-area-inset-bottom)
        );

    }


    button {
      font: inherit;
      cursor: pointer;
    }


    .page {

      width:
        min(100%, 760px);

      margin:
        0 auto;

      padding:

        calc(
          20px +
          env(safe-area-inset-top)
        )

        18px
        40px;

    }


    /* =========================
       HEADER
       ========================= */

    .topbar {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      margin-bottom:
        28px;

    }


    .back {

      border:
        0;

      background:
        transparent;

      color:
        var(--muted);

      padding:
        8px 0;

      font-size:
        14px;

    }


    .brand {
      text-align:
        right;
    }


    .brand-small {

      color:
        var(--gold);

      letter-spacing:
        3px;

      font-size:
        10px;

    }


    .brand-name {

      margin-top:
        4px;

      font-size:
        15px;

      font-family:
        Georgia, serif;

    }


    /* =========================
       TITLE
       ========================= */

    .eyebrow {

      font-size:
        10px;

      letter-spacing:
        4px;

      color:
        var(--gold);

      margin-bottom:
        10px;

    }


    h1 {

      margin:
        0;

      font-family:
        Georgia,
        "Noto Serif TC",
        serif;

      font-weight:
        400;

      font-size:
        31px;

      letter-spacing:
        2px;

    }


    .subtitle {

      margin-top:
        8px;

      color:
        var(--muted);

      font-size:
        13px;

      line-height:
        1.7;

    }


    /* =========================
       COLLECTION SUMMARY
       ========================= */

    .collection-summary {

      margin-top:
        28px;

      border:
        1px solid
        rgba(215,177,132,.22);

      border-radius:
        20px;

      padding:
        21px;

      background:

        linear-gradient(
          145deg,
          rgba(215,177,132,.08),
          rgba(255,255,255,.015)
        );

    }


    .summary-top {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

    }


    .summary-label {

      color:
        var(--muted);

      font-size:
        11px;

      letter-spacing:
        2px;

    }


    .summary-count {

      font-family:
        Georgia, serif;

      font-size:
        28px;

      color:
        var(--gold-soft);

    }


    .progress {

      height:
        5px;

      border-radius:
        999px;

      background:
        rgba(255,255,255,.07);

      overflow:
        hidden;

      margin-top:
        17px;

    }


    .progress-fill {

      width:
        0;

      height:
        100%;

      border-radius:
        999px;

      background:

        linear-gradient(
          90deg,
          #8f6746,
          #e3c099
        );

      transition:
        width .4s ease;

    }


    /* =========================
       SECTION
       ========================= */

    .section-head {

      margin-top:
        34px;

      margin-bottom:
        16px;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

    }


    .section-title {

      font-family:
        Georgia, serif;

      font-size:
        14px;

      letter-spacing:
        2px;

    }


    .section-sub {

      font-size:
        11px;

      color:
        var(--muted);

    }


    /* =========================
       CARD GRID
       ========================= */

    .card-grid {

      display:
        grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap:
        13px;

    }


    .collection-card {

      position:
        relative;

      min-height:
        250px;

      border-radius:
        19px;

      overflow:
        hidden;

      border:
        1px solid
        var(--line);

      background:

        linear-gradient(
          145deg,
          #171717,
          #0c0c0c
        );

    }


    .collection-card.collected {

      border-color:
        rgba(215,177,132,.23);

    }


    .card-image {

      height:
        155px;

      width:
        100%;

      background:

        radial-gradient(
          circle at 50% 20%,
          rgba(215,177,132,.16),
          transparent 45%
        ),

        #101010;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      overflow:
        hidden;

      position:
        relative;

    }


    .card-image img {

      width:
        100%;

      height:
        100%;

      object-fit:
        cover;

      display:
        block;

    }


    .card-placeholder {

      width:
        64px;

      height:
        64px;

      border-radius:
        50%;

      border:
        1px solid
        rgba(215,177,132,.2);

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      color:
        var(--gold);

      font-size:
        26px;

    }


    .card-body {

      padding:
        15px;

    }


    .card-edition {

      font-size:
        9px;

      letter-spacing:
        2px;

      color:
        var(--gold);

      min-height:
        14px;

    }


    .card-name {

      margin-top:
        6px;

      font-family:
        Georgia,
        "Noto Serif TC",
        serif;

      font-size:
        16px;

      line-height:
        1.4;

    }


    .card-meta {

      margin-top:
        10px;

      color:
        var(--muted);

      font-size:
        10px;

      line-height:
        1.7;

    }


    .memory-button {

      width:
        100%;

      margin-top:
        12px;

      padding:
        10px;

      border-radius:
        10px;

      border:
        1px solid
        rgba(215,177,132,.25);

      background:
        rgba(215,177,132,.06);

      color:
        var(--gold-soft);

      font-size:
        11px;

    }


    /* =========================
       LOCKED CARD
       ========================= */

    .locked-card {

      min-height:
        250px;

      border:
        1px solid
        rgba(255,255,255,.055);

      border-radius:
        19px;

      background:

        linear-gradient(
          145deg,
          #101010,
          #090909
        );

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      position:
        relative;

      overflow:
        hidden;

    }


    .locked-card::before {

      content: "";

      position:
        absolute;

      width:
        170px;

      height:
        170px;

      border:
        1px solid
        rgba(255,255,255,.025);

      border-radius:
        50%;

    }


    .lock-symbol {

      font-family:
        Georgia, serif;

      font-size:
        34px;

      color:
        #3f3f3f;

      z-index:
        1;

    }


    .locked-title {

      margin-top:
        14px;

      font-family:
        Georgia, serif;

      font-size:
        15px;

      letter-spacing:
        4px;

      color:
        #666;

      z-index:
        1;

    }


    .locked-text {

      margin-top:
        7px;

      color:
        #484848;

      font-size:
        9px;

      letter-spacing:
        3px;

      z-index:
        1;

    }


    /* =========================
       EMPTY / LOADING
       ========================= */

    .empty,
    .loading {

      grid-column:
        1 / -1;

      border:
        1px dashed
        var(--line);

      border-radius:
        18px;

      padding:
        45px 20px;

      color:
        var(--muted);

      text-align:
        center;

      font-size:
        13px;

      line-height:
        1.9;

    }


    /* =========================
       DETAIL MODAL
       ========================= */

    .modal-mask {

      position:
        fixed;

      inset:
        0;

      background:
        rgba(0,0,0,.82);

      backdrop-filter:
        blur(8px);

      z-index:
        100;

      display:
        none;

      justify-content:
        center;

      align-items:
        flex-end;

    }


    .modal-mask.show {

      display:
        flex;

    }


    .detail-modal {

      width:
        min(100%, 720px);

      max-height:
        92vh;

      overflow-y:
        auto;

      background:
        #101010;

      border-top:
        1px solid
        rgba(215,177,132,.3);

      border-radius:
        26px 26px 0 0;

      padding:

        14px
        20px
        calc(
          25px +
          env(safe-area-inset-bottom)
        );

    }


    .handle {

      width:
        42px;

      height:
        4px;

      border-radius:
        999px;

      background:
        #444;

      margin:
        0 auto 18px;

    }


    .detail-image {

      height:
        260px;

      border-radius:
        17px;

      overflow:
        hidden;

      background:

        radial-gradient(
          circle at 50% 20%,
          rgba(215,177,132,.16),
          transparent 50%
        ),

        #0a0a0a;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }


    .detail-image img {

      width:
        100%;

      height:
        100%;

      object-fit:
        cover;

    }


    .detail-edition {

      color:
        var(--gold);

      letter-spacing:
        3px;

      font-size:
        9px;

      margin-top:
        20px;

    }


    .detail-title {

      margin-top:
        8px;

      font-family:
        Georgia,
        "Noto Serif TC",
        serif;

      font-size:
        27px;

    }


    .detail-line {

      border-top:
        1px solid
        var(--line);

      margin:
        20px 0;

    }


    .detail-row {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        20px;

      margin:
        14px 0;

      font-size:
        12px;

    }


    .detail-label {

      color:
        var(--muted);

    }


    .detail-value {

      text-align:
        right;

      color:
        var(--text);

    }


    .detail-action {

      width:
        100%;

      margin-top:
        18px;

      border:
        0;

      border-radius:
        13px;

      padding:
        14px;

      background:

        linear-gradient(
          135deg,
          #e3c099,
          #a87b55
        );

      color:
        #080808;

      font-weight:
        700;

    }


    .close-button {

      width:
        100%;

      margin-top:
        10px;

      border:
        1px solid
        var(--line);

      border-radius:
        13px;

      padding:
        13px;

      background:
        transparent;

      color:
        var(--muted);

    }


    /* =========================
       TOAST
       ========================= */

    .toast {

      position:
        fixed;

      left:
        50%;

      bottom:
        calc(
          25px +
          env(safe-area-inset-bottom)
        );

      transform:
        translate(-50%, 30px);

      opacity:
        0;

      background:
        #f2dfc6;

      color:
        #111;

      padding:
        12px 18px;

      border-radius:
        999px;

      z-index:
        999;

      font-size:
        12px;

      transition:
        .25s;

      pointer-events:
        none;

      white-space:
        nowrap;

      max-width:
        calc(100% - 40px);

    }


    .toast.show {

      opacity:
        1;

      transform:
        translate(-50%, 0);

    }


    @media (max-width: 390px) {

      .card-grid {
        gap:
          9px;
      }

      .collection-card,
      .locked-card {

        min-height:
          230px;

      }

      .card-image {
        height:
          140px;
      }

      .card-name {
        font-size:
          14px;
      }

    }

  </style>

<style id="wlc-global-theme-bridge">
  /* =========================================================
     Whale Love Club - Global theme bridge
     將此頁原本的黑金變數接到全站 theme.css
     ========================================================= */

  :root {
    --bg: var(--wlc-bg) !important;
    --card: var(--wlc-panel) !important;
    --card-2: var(--wlc-panel-2) !important;
    --card2: var(--wlc-panel-2) !important;
    --line: var(--wlc-border-soft) !important;
    --text: var(--wlc-text) !important;
    --muted: var(--wlc-text-muted) !important;
    --gold: var(--wlc-accent) !important;
    --gold-soft: var(--wlc-accent-strong) !important;
    --green: var(--wlc-success) !important;
    --red: var(--wlc-danger) !important;
  }

  html,
  body {
    background: var(--wlc-bg) !important;
    color: var(--wlc-text) !important;
  }

  body {
    transition:
      background .22s ease,
      color .22s ease;
  }

  .brand-small,
  .eyebrow,
  .summary-heart,
  .add-memory-plus,
  .corner-star,
  .card-edition,
  .detail-edition,
  .edition,
  .symbol,
  .reward-title {
    color: var(--wlc-accent) !important;
  }

  .subtitle,
  .section-sub,
  .summary-title,
  .summary-small,
  .entry-meta,
  .field label,
  .back,
  .note,
  .small,
  .card-meta,
  .detail-label,
  .locked-text {
    color: var(--wlc-text-muted) !important;
  }

  .summary-number,
  .balance,
  .add-memory-text,
  .memory-button,
  .view,
  .btn-secondary {
    color: var(--wlc-accent-strong) !important;
  }

  .summary-card,
  .entry,
  .memory,
  .collection-card,
  .locked-card,
  .stage,
  .card-wrap,
  .reward-box,
  .modal,
  .detail-modal {
    background: var(--wlc-panel) !important;
    border-color: var(--wlc-border-soft) !important;
    box-shadow: var(--wlc-shadow);
  }

  .summary,
  .collection-summary,
  .add-memory-btn,
  .add-button,
  .memory-button,
  .detail-action {
    border-color: var(--wlc-border) !important;
    background:
      linear-gradient(
        145deg,
        color-mix(in srgb, var(--wlc-accent) 10%, transparent),
        color-mix(in srgb, var(--wlc-panel) 94%, transparent)
      ) !important;
    color: var(--wlc-text) !important;
  }

  .input,
  input,
  select,
  textarea {
    background: var(--wlc-bg-soft) !important;
    color: var(--wlc-text) !important;
    border-color: var(--wlc-border-soft) !important;
  }

  .input:focus,
  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--wlc-accent) !important;
  }

  .type-tabs {
    background: var(--wlc-bg-soft) !important;
  }

  .type-tab {
    color: var(--wlc-text-muted) !important;
  }

  .type-tab.active {
    background: var(--wlc-panel-2) !important;
    color: var(--wlc-accent-strong) !important;
  }

  .cancel,
  .close-button,
  .btn-secondary {
    background: transparent !important;
    color: var(--wlc-text-soft) !important;
    border-color: var(--wlc-border) !important;
  }

  .save,
  .btn-primary {
    background:
      linear-gradient(
        135deg,
        var(--wlc-accent-strong),
        var(--wlc-accent-dark)
      ) !important;
    color: #111 !important;
  }

  .modal-handle,
  .handle {
    background: var(--wlc-border) !important;
  }

  .modal-mask {
    background: rgba(0,0,0,.62) !important;
  }

  .toast {
    background: var(--wlc-panel-2) !important;
    color: var(--wlc-text) !important;
    border: 1px solid var(--wlc-border) !important;
  }

  .card-image,
  .detail-image,
  .memory-cover {
    background:
      radial-gradient(
        circle at 50% 22%,
        color-mix(in srgb, var(--wlc-accent) 14%, transparent),
        transparent 48%
      ),
      var(--wlc-bg-soft) !important;
  }

  .date-badge {
    background:
      color-mix(in srgb, var(--wlc-panel) 88%, transparent) !important;
    border-color: var(--wlc-border-soft) !important;
    color: var(--wlc-text) !important;
  }

  .card-placeholder,
  .cover-placeholder {
    color: var(--wlc-accent) !important;
    border-color: var(--wlc-border) !important;
  }

  .progress {
    background: var(--wlc-border-soft) !important;
  }

  .progress-fill {
    background:
      linear-gradient(
        90deg,
        var(--wlc-accent-dark),
        var(--wlc-accent-strong)
      ) !important;
  }

  .detail-line,
  .memory-footer,
  .month-control {
    border-color: var(--wlc-border-soft) !important;
  }

  .error {
    background:
      color-mix(in srgb, var(--wlc-danger) 7%, var(--wlc-panel)) !important;
    border-color:
      color-mix(in srgb, var(--wlc-danger) 28%, transparent) !important;
    color: var(--wlc-danger) !important;
  }

  /* 各主題背景細節 */
  :root[data-theme="black-gold"] body {
    background:
      radial-gradient(
        circle at 50% -8%,
        rgba(215,177,132,.14),
        transparent 32%
      ),
      var(--wlc-bg) !important;
  }

  :root[data-theme="ocean-blue"] body {
    background:
      radial-gradient(
        circle at 50% -8%,
        rgba(118,200,232,.15),
        transparent 32%
      ),
      linear-gradient(
        180deg,
        #061521,
        #081b29 50%,
        #0b2534
      ) !important;
  }

  :root[data-theme="lavender-dream"] body {
    background:
      linear-gradient(
        135deg,
        #f8f5ff,
        #f1eaff 50%,
        #fff8fb
      ) !important;
  }

  :root[data-theme="cream-cafe"] body {
    background:
      linear-gradient(
        135deg,
        #fffaf1,
        #f7efe4 52%,
        #efe1d0
      ) !important;
  }

  :root[data-theme="cute-pastel"] body {
    background:
      linear-gradient(
        135deg,
        #ffe6ef,
        #fff2f6 42%,
        #dff4ff
      ) !important;
  }
</style>

  .collection-card,
  .locked-card,
  .detail-modal {
    color: var(--wlc-text) !important;
  }

  .locked-title,
  .lock-symbol {
    color: var(--wlc-text-muted) !important;
    opacity: .62;
  }

  .detail-value,
  .card-name,
  .detail-title {

    color: var(--wlc-accent-strong) !important;
  }

<body class="cute-collection">


  <main class="page">


    <div class="topbar">

      <button
        class="back"
        onclick="goHome()"
      >
        ← 會員中心
      </button>


      <div class="brand">

        <div class="brand-small">
          ♡ PRIVATE MEMBERS
        </div>

        <div class="brand-name">
          Whale Love Club
        </div>

      </div>

    </div>



    <div class="eyebrow">
      CARD COLLECTION
    </div>


    <h1>
      卡片收藏
    </h1>


    <div class="subtitle">

      每一張卡，
      都代表我們一起留下的一段故事 ♡

    </div>



    <section class="collection-summary">


      <div class="summary-top">

        <div>

          <div class="summary-label">
            COLLECTION PROGRESS
          </div>

          <div
            class="summary-count"
            id="collectionCount"
          >
            0 / 0
          </div>

        </div>


        <div
          class="summary-label"
          id="collectionPercent"
        >
          0%
        </div>

      </div>


      <div class="progress">

        <div
          class="progress-fill"
          id="progressFill"
        ></div>

      </div>


    </section>



    <div class="section-head">

      <div class="section-title">
        MY COLLECTION
      </div>

      <div
        class="section-sub"
        id="lockedCount"
      >
        0 LOCKED
      </div>

    </div>



    <div
      class="card-grid"
      id="cardGrid"
    >

      <div class="loading">
        正在讀取卡片收藏...
      </div>

    </div>


  </main>



  <!-- 卡片詳情 -->

  <div
    class="modal-mask"
    id="modalMask"
  >

    <div class="detail-modal">


      <div class="handle"></div>


      <div
        class="detail-image"
        id="detailImage"
      ></div>


      <div
        class="detail-edition"
        id="detailEdition"
      >

<script>

  const LIFF_ID =
    '2011857714-fZwEK6lN';

  let idToken = '';
  let currentMemoryId = '';
  let cardData = [];

  // 已成功解析的卡面，避免詳情視窗再次讀取
  const cardImageSources =
    new Map();

  // 私人圖片快取
  const IMAGE_DB_NAME =
    'wlc-private-image-cache';

  const IMAGE_STORE_NAME =
    'images';

  const IMAGE_DB_VERSION =
    1;

  const IMAGE_CACHE_MAX_ITEMS =
    120;

  const IMAGE_CACHE_MAX_BYTES =
    80 * 1024 * 1024;


  /* =========================
     INIT
     ========================= */

  async function init() {

    try {

      await liff.init({
        liffId:
          LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login({
          redirectUri:
            window.location.href
        });

        return;

      }


      idToken =
        liff.getIDToken();


      if (!idToken) {

        throw new Error(
          '無法取得 LINE 登入資訊'
        );

      }


      const cached =
        window.WLCFastCache
          ? WLCFastCache.getJSON(
              'collection',
              'list'
            )
          : null;


      if (
        cached &&
        Array.isArray(
          cached.cards
        )
      ) {

        cardData =
          cached.cards;

        renderSummary(
          cached
        );

        renderCards(
          cardData
        );

      }


      try {

        await loadCollection();

      } catch (error) {

        if (!cached) {
          throw error;
        }

        console.warn(
          '背景更新收藏失敗，暫時顯示快取',
          error
        );

      }


    } catch (error) {

      console.error(error);

      document
        .getElementById(
          'cardGrid'
        )
        .innerHTML = `

          <div class="empty">

            無法載入卡片收藏<br>

            ${escapeHtml(
              error.message ||
              '請稍後再試'
            )}

          </div>

        `;

    }

  }


  /* =========================
     LOAD COLLECTION
     ========================= */

  async function loadCollection() {

    const params =
      new URLSearchParams({
        idToken:
          idToken
      });


    const response =
      await fetch(
        '/api/collection?' +
        params.toString()
      );


    const data =
      await response.json();


    if (!data.success) {

      if (
        String(
          data.message || ''
        )
          .toLowerCase()
          .includes('expired')
      ) {

        refreshLogin();
        return;

      }


      throw new Error(
        data.message ||
        '讀取收藏失敗'
      );

    }


    cardData =
      data.cards || [];


    if (window.WLCFastCache) {
      WLCFastCache.setJSON(
        'collection',
        'list',
        {
          total:
            Number(data.total || 0),
          collected:
            Number(data.collected || 0),
          locked:
            Number(data.locked || 0),
          cards:
            cardData
        }
      );
    }


    renderSummary(data);

    renderCards(cardData);

  }


  /* =========================
     SUMMARY
     ========================= */

  function renderSummary(data) {

    const total =
      Number(data.total || 0);

    const collected =
      Number(
        data.collected || 0
      );

    const locked =
      Number(
        data.locked || 0
      );

    const percent =
      total > 0
        ? Math.round(
            collected /
            total *
            100
          )
        : 0;


    document
      .getElementById(
        'collectionCount'
      )
      .textContent =
      `${collected} / ${total}`;


    document
      .getElementById(
        'collectionPercent'
      )
      .textContent =
      `${percent}%`;


    document
      .getElementById(
        'lockedCount'
      )
      .textContent =
      `${locked} LOCKED`;


    document
      .getElementById(
        'progressFill'
      )
      .style
      .width =
      `${percent}%`;

  }


  /* =========================
     CARD GRID
     ========================= */

  function renderCards(cards) {

    const grid =
      document.getElementById(
        'cardGrid'
      );


    if (!cards.length) {

      grid.innerHTML = `

        <div class="empty">

          收藏冊目前還沒有卡片 ♡<br>

          之後建立節日限定 NFC 卡，
          就會出現在這裡。

        </div>

      `;

      return;

    }


    grid.innerHTML =
      cards
        .map(
          (card, index) => {

            // 未解鎖卡片：
            // 不顯示名稱、圖片、福利或回憶
            if (
              !card.collected
            ) {

              return `

                <div class="locked-card">

                  <div class="lock-symbol">
                    ?
                  </div>

                  <div class="locked-title">
                    ???
                  </div>

                  <div class="locked-text">
                    LOCKED
                  </div>

                </div>

              `;

            }


            return `

              <div
                class="collection-card collected"
                onclick="openDetail(${index})"
              >

                <div
                  class="card-image private-card-image"
                  id="cardImage-${index}"
                  data-card-index="${index}"
                >

                  <div class="card-placeholder">
                    ♠
                  </div>

                </div>


                <div class="card-body">


                  <div class="card-edition">

                    ${escapeHtml(
                      card.edition ||
                      'LIMITED EDITION'
                    )}

                  </div>


                  <div class="card-name">

                    ${escapeHtml(
                      card.cardName ||
                      'Whale Love Card'
                    )}

                  </div>


                  <div class="card-meta">

                    ${
                      card.collectedAt

                        ? `Collected · ${
                            escapeHtml(
                              card.collectedAt
                            )
                          }`

                        : 'Collected'
                    }

                  </div>


                </div>

              </div>

            `;

          }
        )
        .join('');


    // LINE WebView 某些版本的 IntersectionObserver
    // 可能不會穩定觸發，因此收藏頁直接載入已解鎖卡面。
    loadAllCardImages();

  }


  async function loadAllCardImages() {

    const elements =
      Array.from(
        document.querySelectorAll(
          '.private-card-image'
        )
      );


    for (const element of elements) {

      loadCardImageElement(
        element
      ).catch(
        error => {
          console.error(
            '卡面直接載入失敗',
            error
          );
        }
      );

    }

  }


  /* =========================
     LAZY LOAD CARD IMAGES
     ========================= */

  function observeCardImages() {

    const elements =
      Array.from(
        document.querySelectorAll(
          '.private-card-image'
        )
      );


    if (!elements.length) {
      return;
    }


    if (
      !('IntersectionObserver' in window)
    ) {

      elements.forEach(
        element => {
          loadCardImageElement(
            element
          );
        }
      );

      return;

    }


    const observer =
      new IntersectionObserver(
        entries => {

          entries.forEach(
            entry => {

              if (
                !entry.isIntersecting
              ) {
                return;
              }


              observer.unobserve(
                entry.target
              );


              loadCardImageElement(
                entry.target
              );

            }
          );

        },
        {
          rootMargin:
            '320px 0px'
        }
      );


    elements.forEach(
      element => {
        observer.observe(
          element
        );
      }
    );

  }


  async function loadCardImageElement(
    element
  ) {

    if (
      !element ||
      element.dataset.loaded === '1'
    ) {
      return;
    }


    element.dataset.loaded =
      '1';


    const index =
      Number(
        element.dataset.cardIndex
      );


    const card =
      cardData[index];


    if (
      !card ||
      !card.collected
    ) {
      return;
    }


    const imageRef =
      String(
        card.cardImageUrl ||
        card.cardImageFileId ||
        card.imageFileId ||
        card.imageUrl ||
        ''
      ).trim();


    if (!imageRef) {
      return;
    }


    try {

      const imageSrc =
        await resolvePrivateImage(
          imageRef
        );


      if (!imageSrc) {
        return;
      }


      cardImageSources.set(
        index,
        imageSrc
      );


      setCardImage(
        element,
        imageSrc,
        card.cardName ||
        'Whale Love Card'
      );


    } catch (error) {

      console.error(
        '卡面載入失敗',
        error
      );

      element.dataset.loaded =
        '0';

    }

  }


  function setCardImage(
    container,
    src,
    alt
  ) {

    const img =
      document.createElement(
        'img'
      );


    img.alt =
      alt || 'card';

    img.decoding =
      'async';


    img.onerror =
      function() {

        container.innerHTML = `
          <div class="card-placeholder">
            ♠
          </div>
        `;

      };


    // 先把 img 放進 DOM，再指定 src。
    // 對 LINE WebView / data URL 會比 detached image 穩定。
    container.innerHTML =
      '';

    container.appendChild(
      img
    );

    img.src =
      src;

  }


  /* =========================
     PRIVATE IMAGE
     ========================= */

  async function resolvePrivateImage(
    imageRef
  ) {

    imageRef =
      String(
        imageRef || ''
      ).trim();


    if (!imageRef) {
      return '';
    }


    // 舊資料若本來就是可用網址，
    // 仍保留相容性。
    if (
      /^https?:\/\//i.test(
        imageRef
      ) ||
      /^data:image\//i.test(
        imageRef
      ) ||
      /^blob:/i.test(
        imageRef
      )
    ) {

      return imageRef;

    }


    const cached =
      await getCachedImage(
        imageRef
      );


    if (cached) {

      touchCachedImage(
        imageRef,
        cached
      ).catch(
        () => {}
      );

      return cached;

    }


    const imageSrc =
      await fetchPrivatePhoto(
        imageRef
      );


    if (imageSrc) {

      putCachedImage(
        imageRef,
        imageSrc
      ).catch(
        error => {
          console.warn(
            '圖片快取失敗',
            error
          );
        }
      );

    }


    return imageSrc;

  }


  async function fetchPrivatePhoto(
    fileId
  ) {

    const response =
      await fetch(
        '/api/photo',
        {
          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              idToken:
                idToken,
              fileId:
                fileId
            })
        }
      );


    const data =
      await response.json();


    if (!data.success) {

      const message =
        String(
          data.message || ''
        );


      if (
        message
          .toLowerCase()
          .includes('expired')
      ) {

        refreshLogin();

        throw new Error(
          'LINE 登入已過期'
        );

      }


      throw new Error(
        message ||
        '卡片圖片讀取失敗'
      );

    }


    if (data.dataUrl) {
      return data.dataUrl;
    }


    if (data.imageUrl) {
      return data.imageUrl;
    }


    if (
      data.image &&
      data.image.dataUrl
    ) {
      return data.image.dataUrl;
    }


    if (
      data.mimeType &&
      data.base64Data
    ) {

      return (
        'data:' +
        data.mimeType +
        ';base64,' +
        data.base64Data
      );

    }


    if (
      data.photo &&
      data.photo.mimeType &&
      data.photo.base64Data
    ) {

      return (
        'data:' +
        data.photo.mimeType +
        ';base64,' +
        data.photo.base64Data
      );

    }


    if (
      data.image &&
      data.image.mimeType &&
      data.image.base64Data
    ) {

      return (
        'data:' +
        data.image.mimeType +
        ';base64,' +
        data.image.base64Data
      );

    }


    throw new Error(
      '卡片圖片資料不完整'
    );

  }


  /* =========================
     INDEXEDDB CACHE
     ========================= */

  function openImageDb() {

    return new Promise(
      (resolve, reject) => {

        if (
          !('indexedDB' in window)
        ) {

          resolve(null);
          return;

        }


        const request =
          indexedDB.open(
            IMAGE_DB_NAME,
            IMAGE_DB_VERSION
          );


        request.onupgradeneeded =
          function(event) {

            const db =
              event.target.result;


            if (
              !db.objectStoreNames.contains(
                IMAGE_STORE_NAME
              )
            ) {

              const store =
                db.createObjectStore(
                  IMAGE_STORE_NAME,
                  {
                    keyPath:
                      'fileId'
                  }
                );


              store.createIndex(
                'lastAccess',
                'lastAccess',
                {
                  unique:
                    false
                }
              );

            }

          };


        request.onsuccess =
          function() {

            resolve(
              request.result
            );

          };


        request.onerror =
          function() {

            reject(
              request.error
            );

          };

      }
    );

  }


  async function getCachedImage(
    fileId
  ) {

    try {

      const db =
        await openImageDb();


      if (!db) {
        return '';
      }


      return await new Promise(
        (resolve, reject) => {

          const tx =
            db.transaction(
              IMAGE_STORE_NAME,
              'readonly'
            );


          const store =
            tx.objectStore(
              IMAGE_STORE_NAME
            );


          const request =
            store.get(
              fileId
            );


          request.onsuccess =
            function() {

              const record =
                request.result;

              resolve(
                record &&
                record.dataUrl
                  ? record.dataUrl
                  : ''
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );


    } catch (error) {

      console.warn(
        '讀取圖片快取失敗',
        error
      );

      return '';

    }

  }


  async function putCachedImage(
    fileId,
    dataUrl
  ) {

    const db =
      await openImageDb();


    if (!db) {
      return;
    }


    const size =
      estimateDataUrlBytes(
        dataUrl
      );


    await new Promise(
      (resolve, reject) => {

        const tx =
          db.transaction(
            IMAGE_STORE_NAME,
            'readwrite'
          );


        tx.objectStore(
          IMAGE_STORE_NAME
        )
          .put({
            fileId:
              fileId,
            dataUrl:
              dataUrl,
            size:
              size,
            lastAccess:
              Date.now()
          });


        tx.oncomplete =
          function() {
            resolve();
          };


        tx.onerror =
          function() {
            reject(
              tx.error
            );
          };

      }
    );


    await trimImageCache(
      db
    );

  }


  async function touchCachedImage(
    fileId,
    dataUrl
  ) {

    const db =
      await openImageDb();


    if (!db) {
      return;
    }


    const size =
      estimateDataUrlBytes(
        dataUrl
      );


    await new Promise(
      (resolve, reject) => {

        const tx =
          db.transaction(
            IMAGE_STORE_NAME,
            'readwrite'
          );


        tx.objectStore(
          IMAGE_STORE_NAME
        )
          .put({
            fileId:
              fileId,
            dataUrl:
              dataUrl,
            size:
              size,
            lastAccess:
              Date.now()
          });


        tx.oncomplete =
          function() {
            resolve();
          };


        tx.onerror =
          function() {
            reject(
              tx.error
            );
          };

      }
    );

  }


  async function trimImageCache(
    db
  ) {

    const records =
      await new Promise(
        (resolve, reject) => {

          const tx =
            db.transaction(
              IMAGE_STORE_NAME,
              'readonly'
            );


          const request =
            tx.objectStore(
              IMAGE_STORE_NAME
            )
              .getAll();


          request.onsuccess =
            function() {

              resolve(
                request.result || []
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );


    let totalBytes =
      records.reduce(
        (sum, item) =>
          sum +
          Number(
            item.size || 0
          ),
        0
      );


    if (
      records.length <=
        IMAGE_CACHE_MAX_ITEMS &&
      totalBytes <=
        IMAGE_CACHE_MAX_BYTES
    ) {

      return;

    }


    records.sort(
      (a, b) =>
        Number(
          a.lastAccess || 0
        ) -
        Number(
          b.lastAccess || 0
        )
    );


    const dbTx =
      db.transaction(
        IMAGE_STORE_NAME,
        'readwrite'
      );


    const store =
      dbTx.objectStore(
        IMAGE_STORE_NAME
      );


    let remainingCount =
      records.length;


    for (
      const item of records
    ) {

      if (
        remainingCount <=
          IMAGE_CACHE_MAX_ITEMS &&
        totalBytes <=
          IMAGE_CACHE_MAX_BYTES
      ) {
        break;
      }


      store.delete(
        item.fileId
      );


      remainingCount--;

      totalBytes -=
        Number(
          item.size || 0
        );

    }


    await new Promise(
      (resolve, reject) => {

        dbTx.oncomplete =
          resolve;

        dbTx.onerror =
          () =>
            reject(
              dbTx.error
            );

      }
    );

  }


  function estimateDataUrlBytes(
    dataUrl
  ) {

    const text =
      String(
        dataUrl || ''
      );


    const comma =
      text.indexOf(',');


    const base64Length =
      comma >= 0
        ? text.length -
          comma -
          1
        : text.length;


    return Math.ceil(
      base64Length *
      0.75
    );

  }


  /* =========================
     DETAIL
     ========================= */

  async function openDetail(
    index
  ) {

    const card =
      cardData[index];


    if (
      !card ||
      !card.collected
    ) {
      return;
    }


    currentMemoryId =
      card.memoryId || '';


    const detailImage =
      document.getElementById(
        'detailImage'
      );


    detailImage.innerHTML = `
      <div class="card-placeholder">
        ♠
      </div>
    `;


    document
      .getElementById(
        'detailEdition'
      )
      .textContent =

      card.edition ||
      'LIMITED EDITION';


    document
      .getElementById(
        'detailTitle'
      )
      .textContent =

      card.cardName ||
      'Whale Love Card';


    document
      .getElementById(
        'detailCollected'
      )
      .textContent =

      card.collectedAt ||
      '-';


    document
      .getElementById(
        'detailRelease'
      )
      .textContent =

      card.releaseDate ||
      '-';


    document
      .getElementById(
        'detailReward'
      )
      .textContent =

      rewardText(card);


    document
      .getElementById(
        'detailRewardStatus'
      )
      .textContent =

      card.rewardClaimed
        ? 'REDEEMED'
        : 'AVAILABLE';


    const memoryButton =
      document.getElementById(
        'memoryButton'
      );


    memoryButton.style.display =

      currentMemoryId
        ? 'block'
        : 'none';


    document
      .getElementById(
        'modalMask'
      )
      .classList
      .add('show');


    const imageRef =
      String(
        card.cardImageUrl ||
        card.cardImageFileId ||
        card.imageFileId ||
        card.imageUrl ||
        ''
      ).trim();


    if (!imageRef) {
      return;
    }


    try {

      const imageSrc =
        cardImageSources.get(
          index
        ) ||
        await resolvePrivateImage(
          imageRef
        );


      if (!imageSrc) {
        return;
      }


      cardImageSources.set(
        index,
        imageSrc
      );


      setCardImage(
        detailImage,
        imageSrc,
        card.cardName ||
        'Whale Love Card'
      );


    } catch (error) {

      console.error(
        '卡片詳情圖片載入失敗',
        error
      );

    }

  }


  function closeDetail() {

    document
      .getElementById(
        'modalMask'
      )
      .classList
      .remove('show');


    currentMemoryId =
      '';

  }


  /* =========================
     MEMORY
     ========================= */

  function openMemory() {

    if (!currentMemoryId) {
      return;
    }


    window.location.href =
      '/memory.html?id=' +
      encodeURIComponent(
        currentMemoryId
      );

  }


  /* =========================
     REWARD TEXT
     ========================= */

  function rewardText(card) {

    const type =
      String(
        card.rewardType || ''
      );


    const amount =
      Number(
        card.rewardAmount || 0
      );


    if (!type) {
      return 'SPECIAL CARD';
    }


    if (
      type === 'LOVE_POINTS'
    ) {

      return (
        'Love Points +' +
        amount
      );

    }


    if (
      type ===
      'MASSAGE_POINTS'
    ) {

      return (
        'Massage +' +
        amount
      );

    }


    if (
      type === 'COUPON'
    ) {

      return (
        'Coupon ×' +
        amount
      );

    }


    return (
      type +
      (
        amount
          ? ' +' + amount
          : ''
      )
    );

  }


  /* =========================
     HELPERS
     ========================= */

  function goHome() {

    window.location.href =
      '/';

  }


  function refreshLogin() {

    try {

      liff.logout();

    } catch (error) {}


    liff.login({
      redirectUri:
        window.location.href
    });

  }


  function showToast(message) {

    const toast =
      document.getElementById(
        'toast'
      );


    toast.textContent =
      message;


    toast.classList.add(
      'show'
    );


    setTimeout(
      () => {

        toast
          .classList
          .remove(
            'show'
          );

      },
      2400
    );

  }


  function escapeHtml(value) {

    return String(
      value ?? ''
    )

      .replaceAll(
        '&',
        '&amp;'
      )

      .replaceAll(
        '<',
        '&lt;'
      )

      .replaceAll(
        '>',
        '&gt;'
      )

      .replaceAll(
        '"',
        '&quot;'
      )

      .replaceAll(
        "'",
        '&#039;'
      );

  }


  init();

</script>
